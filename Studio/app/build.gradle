plugins { id 'com.android.application' }
android {
    namespace 'com.moamal.studio'
    compileSdk 34
    defaultConfig {
        applicationId 'com.moamal.studio'
        minSdk 26
        targetSdk 34
        versionCode(project.hasProperty('buildNum') ? project.property('buildNum').toString().toInteger() : 1)
        versionName '17.0'
    }
    signingConfigs {
        fixed {
            storeFile file('studio.keystore')
            storePassword 'studio123'
            keyAlias 'studio'
            keyPassword 'studio123'
        }
    }
    buildTypes { debug { signingConfig signingConfigs.fixed } }
    sourceSets.main {
        java.srcDirs += '../../widgets/java'
        res.srcDirs += '../../widgets/res'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packagingOptions {
        resources { excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF', 'META-INF/*.kotlin_module'] }
    }
    // the identity engine is the TV launcher's own file: copied in at build time, never duplicated in the repository
    sourceSets.main.assets.srcDirs += layout.buildDirectory.dir('shared-assets').get().asFile
}
tasks.register('copyShared', Copy) {
    from('../../CleanTV/app/src/main/assets') { include 'brands.js', 'fonts/**' }
    into layout.buildDirectory.dir('shared-assets')
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn 'copyShared' }

dependencies {
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    implementation 'com.github.MuntashirAkon:sun-security-android:1.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'
}
