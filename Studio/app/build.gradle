plugins { id 'com.android.application' }
android {
    namespace 'com.moamal.studio'
    compileSdk 34
    defaultConfig {
        applicationId 'com.moamal.studio'
        minSdk 26
        targetSdk 34
        versionCode(project.hasProperty('buildNum') ? project.property('buildNum').toString().toInteger() : 1)
        versionName '2.' + (project.hasProperty('buildNum') ? (project.property('buildNum').toString().toInteger() - 3).toString() : '0')
    }
    signingConfigs {
        fixed {
            storeFile file('studio.keystore')
            storePassword 'studio123'
            keyAlias 'studio'
            keyPassword 'studio123'
        }
    }
    buildTypes { debug { signingConfig signingConfigs.fixed } }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packagingOptions {
        resources { excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF', 'META-INF/*.kotlin_module'] }
    }
}
dependencies {
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    implementation 'com.github.MuntashirAkon:sun-security-android:1.1'
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    implementation 'org.lsposed.hiddenapibypass:hiddenapibypass:6.1'
}
