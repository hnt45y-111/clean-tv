plugins {
    id 'com.android.application'
}
android {
    namespace 'com.cleantv.launcher'
    compileSdk 34
    defaultConfig {
        applicationId 'com.cleantv.launcher'
        minSdk 24
        targetSdk 34
        versionCode(project.hasProperty('buildNum') ? project.property('buildNum').toString().toInteger() : 4)
        versionName '5.0'
    }
    signingConfigs {
        fixed {
            storeFile file('cleantv.keystore')
            storePassword 'cleantv123'
            keyAlias 'cleantv'
            keyPassword 'cleantv123'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.fixed }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests.includeAndroidResources = true
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    testImplementation 'androidx.test:core:1.6.1'
}
