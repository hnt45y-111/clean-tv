<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>واجهة السيارة</title>
<style>
  /* Written for old car WebViews (Android 8/9): no inset, no flex gap, no aspect-ratio. Spacing comes from grid-gap. */
  @font-face { font-family: 'Plex'; font-weight: 400; src: url('fonts/PlexArabic-Regular.ttf'); }
  @font-face { font-family: 'Plex'; font-weight: 500; src: url('fonts/PlexArabic-Medium.ttf'); }
  @font-face { font-family: 'Plex'; font-weight: 600; src: url('fonts/PlexArabic-SemiBold.ttf'); }
  @font-face { font-family: 'Plex'; font-weight: 700 800; src: url('fonts/PlexArabic-Bold.ttf'); }
  @font-face { font-family: 'Alx'; font-weight: 100 900; src: url('fonts/Alexandria.ttf'); }
  @font-face { font-family: 'Tajawal'; font-weight: 400; src: url('fonts/Tajawal-Regular.ttf'); }
  @font-face { font-family: 'Tajawal'; font-weight: 500; src: url('fonts/Tajawal-Medium.ttf'); }
  @font-face { font-family: 'Tajawal'; font-weight: 700; src: url('fonts/Tajawal-Bold.ttf'); }
  @font-face { font-family: 'Tajawal'; font-weight: 800; src: url('fonts/Tajawal-ExtraBold.ttf'); }
  :root { --ac: #ff3b3b; --ac2: #ff8a3b; --bg1: #07080b; --bg2: #15171d; --glow1: rgba(255,59,59,.18); --glow2: rgba(255,138,59,.10);
          --card: rgba(255,255,255,.07); --cardb: rgba(255,255,255,.10); --line: rgba(255,255,255,.12); --ink: #fff; --mute: rgba(255,255,255,.62);
          --r: 3vh; --gap: 1.8vh; --fs: 1; --ic: 11vh; --hfw: 800; --ls: 0; --dockh: 12vh; }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: #000; touch-action: manipulation; }
  body { font-family: 'Plex', 'Tajawal', sans-serif; color: var(--ink); }
  .big, .clk b, .dg b, .sbar b, #bar .tm, #saver .ct, #saver .sp b, .stats b { font-family: 'Alx', 'Plex', 'Tajawal', sans-serif; }
  .fill { position: fixed; top: 0; left: 0; right: 0; bottom: 0; }
  #bgl { background: radial-gradient(90% 120% at 85% -10%, var(--bg2), var(--bg1) 62%); }
  #bgl::before, #bgl::after { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; }
  #bgl::before { background: radial-gradient(55% 60% at 12% 100%, var(--glow1), transparent 70%), radial-gradient(45% 50% at 95% 30%, var(--glow2), transparent 70%); }
  #bgimg { background: center/cover no-repeat; opacity: 0; transition: opacity 1.2s; }
  #bgimg.on { opacity: var(--bgo, .55); }
  #bgdim { background: linear-gradient(180deg, rgba(0,0,0,.35), rgba(0,0,0,.15) 40%, rgba(0,0,0,.55)); display: none; }
  #bgimg.on + #bgdim { display: block; }
  body.night #bgimg.on { opacity: .16; }

  #app { position: absolute; top: 0; left: 0; right: 0; bottom: 0; display: grid; grid-template-rows: 7.5vh 1fr var(--dockh); grid-row-gap: var(--gap); padding: 1.8vh 2.2vw 1.8vh; }

  /* ---------- top bar ---------- */
  #bar { display: flex; align-items: center; font-size: calc(2.7vh * var(--fs)); font-weight: 500; color: var(--mute); white-space: nowrap; min-width: 0; }
  #bar > * { margin-left: 1.8vw; }
  #bar .own { color: var(--ink); font-weight: var(--hfw); }
  #bar .sp { flex: 1; margin: 0; }
  #bar .tm { color: var(--ink); font-weight: 700; direction: ltr; font-size: calc(3.2vh * var(--fs)); }
  #bar .brand { display: none; align-items: center; color: var(--ink); }
  body.hasbrand #bar .brand { display: flex; }
  body.hasbrand #bar .own { display: none; }
  #bar .brand .lg { height: 5vh; width: 5vh; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--bc, var(--ac)); font-weight: 800; font-size: 2.4vh; color: #fff; direction: ltr; margin-left: 1vw; }
  #bar .brand img.lg { background: none; object-fit: contain; border-radius: 0; width: auto; max-width: 14vh; }
  #bar .brand .bn { font-weight: var(--hfw); letter-spacing: calc(.14em + var(--ls)); font-size: 2.4vh; direction: ltr; }
  #bar .brand .md { color: var(--mute); font-weight: 500; font-size: 2.3vh; margin-right: 1vw; }
  .pill { display: none; align-items: center; padding: .6vh 1.4vw; border-radius: 99px; font-size: 2.1vh; font-weight: 700; background: var(--card); border: 1px solid var(--cardb); color: var(--ink); }
  .pill.on { display: flex; }
  #drvPill { background: var(--ac); color: #fff; border-color: transparent; }
  #limPill.on { display: flex; }

  /* ---------- volume buttons: fixed top-left, optional ---------- */
  #vol { display: none; direction: ltr; -webkit-box-ordinal-group: 100; order: 99; margin: 0 1.6vw 0 0 !important; flex: none; }
  body.hasvol #vol { display: flex; }
  body[data-volpos="right"] #vol { -webkit-box-ordinal-group: 0; order: -1; margin: 0 0 0 1.6vw !important; }
  #vol button { width: 6.2vh; height: 6.2vh; border-radius: 50%; border: 1px solid rgba(255,255,255,.16); color: #fff; margin-right: 1vh; display: flex; align-items: center; justify-content: center;
     background: radial-gradient(circle at 35% 25%, rgba(255,255,255,.28), rgba(255,255,255,.06) 60%), rgba(20,22,28,.55); box-shadow: 0 .8vh 2vh -.6vh rgba(0,0,0,.8), inset 0 .15vh 0 rgba(255,255,255,.25); }
  #vol button svg { width: 3.3vh; height: 3.3vh; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  #vol button:active { background: var(--ac); transform: scale(.92); }
  #vol .lvl { align-self: center; width: 9vh; height: .8vh; border-radius: 99px; background: rgba(255,255,255,.18); overflow: hidden; margin-right: 1vh; display: none; }
  #vol .lvl i { display: block; height: 100%; background: var(--ac); width: 0; transition: width .3s; }
  #vol.showlvl .lvl { display: block; }

  /* ---------- main + cards ---------- */
  #main { display: grid; grid-gap: var(--gap); grid-template-columns: 44fr 56fr; min-height: 0; }
  body[data-side="left"] #widgets { -webkit-box-ordinal-group: 3; order: 2; }
  body[data-wlayout="top"] #main { grid-template-columns: 1fr; grid-template-rows: 42fr 58fr; }
  body[data-wlayout="none"] #main { grid-template-columns: 1fr; }
  body[data-wlayout="none"] #widgets { display: none; }
  #widgets { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 1fr; grid-gap: var(--gap); min-height: 0; min-width: 0; }
  body[data-wlayout="top"] #widgets { grid-template-columns: repeat(4, 1fr); grid-template-rows: 1fr; }
  .w { position: relative; overflow: hidden; border-radius: var(--r); padding: 2vh 1.6vw; display: flex; flex-direction: column; justify-content: center; min-height: 0; min-width: 0;
       background: var(--card); border: 1px solid var(--cardb); }
  body[data-cards="glass"] .w { background: rgba(255,255,255,var(--cop,.08)); -webkit-backdrop-filter: blur(18px); backdrop-filter: blur(18px); box-shadow: 0 2vh 4vh -2.5vh rgba(0,0,0,.8), inset 0 .15vh 0 rgba(255,255,255,.08); }
  body[data-cards="solid"] .w { background: rgba(22,24,30,var(--copS,.92)); border-color: rgba(255,255,255,.06); }
  body[data-cards="outline"] .w { background: transparent; border: .25vh solid var(--line); }
  body[data-cards="clear"] .w { background: transparent; border-color: transparent; }
  .w.l { grid-column: span 2; }
  .w[data-bg="glass"] { background: rgba(255,255,255,.1) !important; border-color: rgba(255,255,255,.12) !important; }
  .w[data-bg="solid"] { background: rgba(18,20,26,.94) !important; }
  .w[data-bg="clear"] { background: transparent !important; border-color: transparent !important; box-shadow: none !important; }
  .w[data-bg="accent"] { background: linear-gradient(150deg, var(--wc, var(--ac)), rgba(0,0,0,.35)) !important; border-color: transparent !important; }
  .w[data-bg="gradient"] { background: linear-gradient(160deg, rgba(255,255,255,.12), rgba(255,255,255,.02)), linear-gradient(200deg, var(--wc, var(--ac)) -40%, transparent 70%) !important; }
  .w .lb { font-size: calc(2.2vh * var(--fs)); color: var(--mute); font-weight: 500; margin-bottom: .6vh; }
  .w[data-nolb] .lb { display: none; }
  .w[data-tsz="s"] { --wfs: .82; } .w[data-tsz="l"] { --wfs: 1.22; }
  .big { font-size: calc(7vh * var(--fs) * var(--wfs, 1)); font-weight: 800; line-height: 1.05; }
  .sub { font-size: calc(2.2vh * var(--fs)); color: var(--mute); margin-top: .6vh; }
  .w:active { opacity: .9; }
  .ctr { display: flex; align-items: center; justify-content: center; height: 100%; }

  /* speed */
  .spd { display: flex; align-items: center; justify-content: center; height: 100%; position: relative; }
  .spd svg.g { width: 26vh; height: 100%; max-height: 26vh; flex: none; }
  .w.l .spd svg.g { width: 32vh; max-height: 32vh; }
  .spd .meta { font-size: calc(2.2vh * var(--fs)); color: var(--mute); line-height: 1.7; margin-right: 2vw; max-width: 40%; }
  .spd .meta b { display: block; color: var(--ink); font-size: 3vh; }
  .g .trk { fill: none; stroke: rgba(255,255,255,.1); }
  .g .val { fill: none; stroke: var(--wc, var(--ac)); stroke-linecap: round; transition: stroke-dashoffset .7s ease; }
  .g .num { font-weight: 800; fill: var(--ink); font-family: Tajawal, sans-serif; }
  .g .unit { fill: var(--mute); font-family: Tajawal, sans-serif; }
  .g .tk { stroke: rgba(255,255,255,.35); }
  .g .tk.mj { stroke: rgba(255,255,255,.8); }
  .g .lbn { fill: var(--mute); font-size: 11px; font-family: Tajawal, sans-serif; }
  .g .ndl { transition: transform .7s ease; }
  .g .dot { fill: rgba(255,255,255,.12); transition: fill .3s; }
  .g .dot.on { fill: var(--wc, var(--ac)); }
  .spd.over .val, .spd.over .dot.on { stroke: #ff2d2d; fill: #ff2d2d; }
  .spd.over .g .val { fill: none; }
  .spd.over .num, .spd.over .dg b { fill: #ff5050; color: #ff5050; }
  .dg { text-align: center; }
  .dg b { display: block; font-size: calc(15vh * var(--wfs, 1)); font-weight: 800; line-height: .95; direction: ltr; }
  .w.l .dg b { font-size: 19vh; }
  .dg span { font-size: 2.5vh; color: var(--mute); }
  .sbar { width: 100%; }
  .sbar .row { display: flex; align-items: flex-end; justify-content: space-between; }
  .sbar b { font-size: calc(11vh * var(--wfs, 1)); font-weight: 800; line-height: .9; direction: ltr; }
  .sbar .segs { display: flex; direction: ltr; margin-top: 1.6vh; height: 3vh; }
  .sbar .segs i { flex: 1; margin-right: .5vh; border-radius: .6vh; background: rgba(255,255,255,.1); transition: background .3s; }
  .sbar .segs i.on { background: var(--wc, var(--ac)); }
  .sbar .segs i.hot.on { background: #ff3b30; }
  .spd.over .sbar b { color: #ff5050; }

  /* clock */
  .clk { text-align: center; }
  .clk b { display: block; font-size: calc(12vh * var(--fs) * var(--wfs, 1)); font-weight: 700; line-height: 1; direction: ltr; }
  .w.l .clk b { font-size: calc(16vh * var(--wfs, 1)); }
  .w:not(.l) .clk b { font-size: calc(9vh * var(--fs) * var(--wfs, 1)); white-space: nowrap; }
  .clk span, .w .sub, .w .lb { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: block; }
  .clk span { font-size: calc(2.5vh * var(--fs)); color: var(--mute); }
  .clk.thin b { font-weight: 400; letter-spacing: -.02em; }
  .clk.seg b { font-family: monospace; font-weight: 700; color: var(--wc, var(--ac)); text-shadow: 0 0 2vh var(--wc, var(--ac)); }
  .clk.stack b { font-size: calc(7vh * var(--wfs, 1)); line-height: .95; }
  .w:not(.l) .clk.stack b { font-size: 5.4vh; }
  .w.l .clk.stack b { font-size: calc(10vh * var(--wfs, 1)); }
  .clk.stack b i { display: block; font-style: normal; color: var(--wc, var(--ac)); }
  .anal { height: 100%; } .anal svg { width: 26vh; height: 100%; max-height: 26vh; display: block; margin: 0 auto; }

  /* media */
  .med { display: flex; align-items: center; min-width: 0; position: relative; height: 100%; }
  .med .art { width: 15vh; height: 15vh; border-radius: 2vh; background: var(--line) center/cover; flex: none; margin-left: 1.6vw; box-shadow: 0 1.2vh 3vh -1.4vh rgba(0,0,0,.9); }
  .w:not(.l) .med .art { width: 10vh; height: 10vh; }
  .med .tx { flex: 1; min-width: 0; }
  .med .t { font-size: calc(3.3vh * var(--fs) * var(--wfs, 1)); font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .med .a { font-size: calc(2.3vh * var(--fs)); color: var(--mute); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: .4vh; }
  .med .pg { height: .55vh; border-radius: 99px; background: rgba(255,255,255,.14); margin-top: 1.2vh; overflow: hidden; }
  .med .pg i { display: block; height: 100%; width: 0; background: var(--wc, var(--ac)); transition: width 1s linear; }
  .mctl { display: flex; margin-top: 1.3vh; direction: ltr; justify-content: flex-end; }
  .mctl button { width: 7.2vh; height: 7.2vh; border-radius: 50%; border: 0; background: rgba(255,255,255,.12); color: var(--ink); display: flex; align-items: center; justify-content: center; margin-left: 1.2vh; }
  .mctl button.pp { background: var(--wc, var(--ac)); color: #fff; width: 8.4vh; height: 8.4vh; }
  .mctl svg { width: 3.4vh; height: 3.4vh; fill: currentColor; }
  .w:not(.l) .med .lb, .w:not(.l) .med .pg { display: none; }
  .w:not(.l) .mctl button { width: 6vh; height: 6vh; } .w:not(.l) .mctl button.pp { width: 6.8vh; height: 6.8vh; }
  .med .na { display: none; margin-top: 1vh; font: inherit; font-size: 2.1vh; padding: .8vh 1.4vw; border-radius: 99px; border: 1px solid var(--line); background: rgba(255,255,255,.08); color: var(--ink); }
  .med.noacc .na { display: inline-block; }
  .w.cover .medbg { position: absolute; top: -10%; left: -10%; right: -10%; bottom: -10%; background: center/cover; filter: blur(30px) saturate(1.4); opacity: .55; }
  .w.cover .med { z-index: 1; }

  /* small info widgets */
  .cmp svg { width: 20vh; height: 100%; max-height: 20vh; flex: none; margin-left: 1.4vw; }
  .dial { display: grid; grid-template-columns: repeat(4, 1fr); grid-gap: 1.2vh; }
  .w:not(.l) .dial { grid-template-columns: repeat(2, 1fr); }
  .dial button { border: 0; background: none; color: var(--ink); font: inherit; display: flex; flex-direction: column; align-items: center; }
  .dial button i { width: 9vh; height: 9vh; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-style: normal; font-weight: 800; font-size: 3.4vh; background: var(--dc, var(--ac)); color: #fff; box-shadow: 0 1vh 2vh -1vh rgba(0,0,0,.8); }
  .dial button span { font-size: 2vh; margin-top: .8vh; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .mnt .it { display: flex; align-items: center; justify-content: space-between; font-size: 2.3vh; margin-top: .9vh; }
  .mnt .it i { font-style: normal; color: var(--mute); }
  .mnt .it.due i { color: #ff6b5b; font-weight: 700; }
  .mnt .bar { height: .6vh; border-radius: 99px; background: rgba(255,255,255,.12); margin-top: .4vh; overflow: hidden; }
  .mnt .bar b { display: block; height: 100%; background: var(--ac); }
  .mnt .it.due + .bar b { background: #ff5b4b; }

  /* ---------- apps ---------- */
  #apps { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
  #apps .hd { display: flex; align-items: center; justify-content: space-between; font-size: calc(2.5vh * var(--fs)); font-weight: 700; margin-bottom: var(--gap); }
  #apps .hd button { background: var(--card); color: var(--ink); font: inherit; font-size: 2.2vh; padding: .9vh 1.8vw; border-radius: 99px; border: 1px solid var(--cardb); }
  body[data-apphd="off"] #apps .hd { display: none; }
  #grid { flex: 1; display: grid; grid-template-columns: repeat(var(--cols, 4), 1fr); grid-auto-rows: 1fr; grid-gap: var(--gap); min-height: 0; }
  .app { display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; min-width: 0; min-height: 0; border-radius: var(--r); }
  body[data-tilebg="on"] .app { background: var(--card); border: 1px solid var(--cardb); }
  .app .pl { width: var(--ic); height: var(--ic); border-radius: 24%; display: flex; align-items: center; justify-content: center; flex: none; position: relative; overflow: hidden;
     background: linear-gradient(160deg, var(--c, var(--ac)), rgba(0,0,0,.35) 140%); box-shadow: 0 1.4vh 2.6vh -1.4vh rgba(0,0,0,.85); }
  .app .pl img { width: 72%; height: 72%; object-fit: contain; }
  .app .pl svg { width: 55%; height: 55%; stroke: #fff; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .app b { font-size: calc(2.2vh * var(--fs)); font-weight: 700; text-align: center; margin-top: 1vh; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; padding: 0 .4vw; }
  body[data-labels="off"] .app b { display: none; }
  .app:active .pl { -webkit-transform: scale(.92); transform: scale(.92); }
  body[data-icons="circle"] .app .pl { border-radius: 50%; }
  body[data-icons="square"] .app .pl { border-radius: 12%; }
  body[data-icons="glass"] .app .pl { background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.18); -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px); }
  body[data-icons="glass"] .app .pl::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 50%; background: linear-gradient(180deg, rgba(255,255,255,.22), transparent); }
  body[data-icons="neon"] .app .pl { background: rgba(0,0,0,.35); border-radius: 50%; box-shadow: 0 0 0 .35vh var(--c, var(--ac)), 0 0 3vh -.4vh var(--c, var(--ac)), inset 0 0 2vh -1vh var(--c, var(--ac)); }
  body[data-icons="neon"] .app .pl svg { stroke: var(--c, var(--ac)); }
  body[data-icons="flat"] .app .pl { background: none; box-shadow: none; }
  body[data-icons="flat"] .app .pl img { width: 100%; height: 100%; }
  body[data-icons="flat"] .app .pl svg { stroke: var(--c, var(--ac)); width: 70%; height: 70%; }
  body[data-icons="mono"] .app .pl { background: linear-gradient(160deg, #3a3d45, #1d1f25); }
  body[data-icons="mono"] .app .pl img { -webkit-filter: grayscale(1) brightness(1.35); filter: grayscale(1) brightness(1.35); }
  body[data-icons="white"] .app .pl { background: #f4f5f7; }
  body[data-icons="white"] .app .pl svg { stroke: var(--c, #111); }
  body[data-icons="outline"] .app .pl { background: transparent; border: .3vh solid var(--line); box-shadow: none; border-radius: 28%; }
  body[data-icons="outline"] .app .pl svg { stroke: var(--ink); }

  /* ---------- dock ---------- */
  #dock { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; grid-gap: 1.2vh; align-items: stretch; }
  #dock button { min-width: 0; border-radius: 2.6vh; border: 1px solid var(--cardb); background: var(--card); color: var(--ink); display: flex; flex-direction: column; align-items: center; justify-content: center; font: inherit; font-size: calc(1.9vh * var(--fs)); font-weight: 700; position: relative; }
  #dock button svg { width: 4vh; height: 4vh; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; margin-bottom: .4vh; }
  #dock button.home { background: var(--ac); color: #fff; border-color: transparent; }
  #dock button:active { opacity: .7; }
  body[data-dock="bar"] #dock { background: rgba(10,11,14,.72); border: 1px solid var(--cardb); border-radius: 3vh; padding: .8vh; grid-gap: .4vh; }
  body[data-dock="bar"] #dock button { border: 0; background: transparent; }
  body[data-dock="bar"] #dock button.home { background: var(--ac); }
  body[data-dock="line"] #dock button { border: 0; background: transparent; border-radius: 0; }
  body[data-dock="line"] #dock button.home { background: transparent; color: var(--ac); }
  body[data-dock="line"] #dock button.home::after { content: ''; position: absolute; bottom: .4vh; left: 30%; right: 30%; height: .5vh; border-radius: 99px; background: var(--ac); box-shadow: 0 0 2vh var(--ac); }
  body[data-dock="icons"] #dock button span { display: none; }
  body[data-dock="icons"] #dock button svg { width: 4.8vh; height: 4.8vh; margin: 0; }

  /* ---------- layout: CarPlay (side rail, big icons) ---------- */
  body[data-lay="carplay"] #main { grid-template-columns: 36fr 64fr; }
  body[data-lay="carplay"] #widgets { grid-template-columns: 1fr; }
  body[data-lay="carplay"] .w.l { grid-column: span 1; }
  body[data-lay="carplay"] #apps .hd { display: none; }
  body[data-lay="carplay"] { --ic: 15vh; }

  /* ---------- layout: MBUX (wide cards on top, app strip, floating bar) ---------- */
  body[data-lay="mbux"] #main { grid-template-columns: 1fr; grid-template-rows: 60fr 40fr; }
  body[data-lay="mbux"] #widgets { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: 1fr; grid-template-rows: 1fr; }
  body[data-lay="mbux"] .w.l { grid-column: span 1; }
  body[data-lay="mbux"] .w { border-radius: 2.4vh; }
  body[data-lay="mbux"] #apps .hd { display: none; }
  body[data-lay="mbux"] #grid { grid-template-columns: none; grid-auto-flow: column; grid-auto-columns: calc((100% - 6 * var(--gap)) / 7); grid-template-rows: 1fr; overflow-x: auto; }

  #alertFx { pointer-events: none; z-index: 40; border: 1.2vh solid #ff2d2d; opacity: 0; box-shadow: inset 0 0 8vh rgba(255,0,0,.5); }

     background: rgba(20,22,28,.95); border: 1px solid rgba(255,190,80,.5); box-shadow: 0 2vh 5vh -2vh rgba(0,0,0,.9); font-size: 2.5vh; white-space: nowrap; }

  /* ---------- where the app bar sits: bottom (default), top, right, left ---------- */
  body[data-dockpos="top"] #app { grid-template-rows: 7.5vh var(--dockh) 1fr; }

  body[data-dockpos="right"] #app, body[data-dockpos="left"] #app { grid-template-rows: 7.5vh 1fr; grid-column-gap: 1.8vw; }

  body[data-dockpos="left"] #app { grid-template-columns: 1fr 12.5vh; }

     background: rgba(10,11,14,.75); border: 1px solid var(--cardb); }
  body[data-dockpos="right"] #dock button, body[data-dockpos="left"] #dock button { flex-direction: column; border: 0; background: transparent; font-size: 1.55vh; border-radius: 2.4vh; padding: 0 .3vh; }

  body[data-dockpos="top"] #dock { justify-self: stretch; width: auto; }
