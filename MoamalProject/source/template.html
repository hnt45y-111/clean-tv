<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#43c6ff">
<title>مغامرة القراءة</title>
<link href="fonts/fonts.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Baloo+Bhaijaan+2:wght@600;700;800&display=swap" rel="stylesheet">
<script src="voices/index.js"></script>
<script src="quran/quran.js"></script>
<style>
:root{
  --ol:#2b1d52;--ink:#2b1d52;--mut:#6b5a9b;--line:#e7defc;
  --y:#ffd93d;--o:#ff8e3c;--p:#ff5da2;--b:#4cc9f0;--g:#6bcb77;--v:#8e6cf0;--r:#ff595e;--t:#2ec4b6;--cream:#fff8e7;
  --sun:#ffd93d;--red:#ff595e;--grn:#4bbf5f;--blu:#4cc9f0;--pur:#8e6cf0;--pnk:#ff5da2;--org:#ff8e3c;
  --ok:#3ec46d;--bad:#ff595e;
  --f:'Baloo Bhaijaan 2','Cairo','Segoe UI',Tahoma,sans-serif;
  --navH:100px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;color:var(--ol);font-family:var(--f);font-weight:800;overflow-x:hidden}
body{background:linear-gradient(180deg,#43c6ff 0%,#8fdcff 45%,#c9f3ff 80%);background-attachment:fixed;user-select:none;-webkit-user-select:none;overflow-y:hidden}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
:focus{outline:none}
.kbd :focus-visible,.kbd .tvf{outline:6px solid var(--y)!important;outline-offset:4px;box-shadow:0 0 0 14px #ffd93d66!important;position:relative;z-index:3}
[hidden]{display:none!important}
img{max-width:100%}

/* ---------- scenery ---------- */
#scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.sunf{position:absolute;top:14px;left:14px;width:80px;height:80px;border-radius:50%;background:var(--y);border:4px solid var(--ol);box-shadow:0 0 0 10px #ffe98a88}
.sunf:before{content:'';position:absolute;inset:-26px;border-radius:50%;background:repeating-conic-gradient(#ffe066 0 12deg,transparent 12deg 30deg);z-index:-1;animation:spin 24s linear infinite}
.sunf i{position:absolute;top:27px;width:9px;height:12px;border-radius:50%;background:var(--ol);animation:blink 5s infinite}.sunf i:nth-child(1){left:22px}.sunf i:nth-child(2){right:22px}
.sunf b{position:absolute;bottom:18px;left:50%;width:28px;height:14px;margin-left:-14px;border:4px solid var(--ol);border-top:0;border-radius:0 0 20px 20px}
.cl{position:absolute;background:#fff;border:3.5px solid var(--ol);border-radius:40px;height:36px;animation:drift linear infinite}
.cl:before,.cl:after{content:'';position:absolute;background:#fff;border:3.5px solid var(--ol);border-bottom:0;border-radius:50% 50% 0 0}
.cl:before{width:44px;height:30px;top:-24px;left:16px}.cl:after{width:34px;height:24px;top:-18px;left:52px}
@keyframes drift{from{transform:translateX(110vw)}to{transform:translateX(-200px)}}
.hills{position:absolute;bottom:0;left:0;width:100%;height:160px}
.flyer{position:absolute;font-size:30px;animation:flyx 26s linear infinite}
@keyframes flyx{from{transform:translateX(-80px)}50%{transform:translateX(50vw) translateY(-30px)}to{transform:translateX(110vw)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- shell ---------- */
#shell{position:relative;z-index:1;height:100%;display:flex;flex-direction:column}
#col{flex:1;min-width:0;min-height:0;display:flex;flex-direction:column}
#hud{display:flex;align-items:center;gap:7px;padding:calc(env(safe-area-inset-top,0px) + 10px) 10px 6px;flex:none}
.hb{width:50px;height:50px;flex:none;border-radius:50%;background:#fff;border:3.5px solid var(--ol);box-shadow:0 4px 0 var(--ol);font-size:23px;display:grid;place-items:center;transition:transform .1s}
.hb:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ol)}
#backBtn{background:var(--y);font-size:26px}
.hb.on{background:var(--r);animation:pulse 1s infinite}
.me{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:#fff;border:3.5px solid var(--ol);border-radius:24px;box-shadow:0 4px 0 var(--ol);padding:4px 10px 4px 5px;height:52px}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:22px;background:var(--y);border:3px solid var(--ol);flex:none}
.me b{font-size:15px;display:block;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp{height:11px;border-radius:9px;background:#efe6ff;border:2.5px solid var(--ol);overflow:hidden;margin-top:2px}
.xp i{display:block;height:100%;width:0;background:var(--g);transition:width .6s}
.pill{display:flex;align-items:center;gap:3px;padding:0 10px;height:52px;border-radius:24px;background:#fff;border:3.5px solid var(--ol);box-shadow:0 4px 0 var(--ol);font-size:18px;white-space:nowrap;flex:none}
@media(max-width:480px){#hud{gap:5px;padding-left:6px;padding-right:6px}.hb{width:44px;height:44px;font-size:20px}.pill{height:46px;padding:0 7px;font-size:15px}.me{height:46px}.av{width:30px;height:30px;font-size:18px}.me b{font-size:13px}}
@media(max-width:480px){#recBtn{display:none}}@media(max-width:350px){#hGift{display:none}}
#recbar{margin:0 12px 6px;padding:8px 14px;border-radius:20px;background:var(--r);color:#fff;display:flex;gap:10px;align-items:center;font-size:15px;border:3.5px solid var(--ol);box-shadow:0 4px 0 var(--ol);flex:none}
#recbar button{background:#fff;color:var(--r);border:3px solid var(--ol);border-radius:14px;padding:2px 12px;margin-inline-start:auto}
#view{position:relative;flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding:4px 14px calc(var(--navH) + 40px)}
#view>*{max-width:900px;margin-left:auto;margin-right:auto}
#view.enter>*{animation:enter .45s cubic-bezier(.2,.9,.3,1.3) backwards}
@keyframes enter{from{opacity:0;transform:translateY(30px) scale(.95)}}

/* ---------- grass nav ---------- */
#nav{position:fixed;bottom:0;left:0;right:0;z-index:40;height:calc(var(--navH) + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around;align-items:flex-end;padding:0 4px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(#7ed957,#4caf50);border-top:4px solid var(--ol);border-radius:34px 34px 0 0;box-shadow:inset 0 6px 0 #ffffff55}
#nav:after{content:'🌼        🌸            🌼         🌷';position:absolute;bottom:2px;left:10px;right:10px;font-size:11px;white-space:pre;text-align:center;pointer-events:none}
#nav button{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:#fff;-webkit-text-stroke:3.5px var(--ol);paint-order:stroke fill;transition:transform .2s;min-width:0;flex:1}
#nav button span{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:27px;background:radial-gradient(circle at 32% 26%,#ffffffaa 0 14%,transparent 15%),var(--c);border:3.5px solid var(--ol);box-shadow:0 5px 0 var(--ol);-webkit-text-stroke:0;transition:all .2s}
#nav button b{font-weight:800}
#nav button.on{transform:translateY(-12px)}
#nav button.on span{width:64px;height:64px;font-size:36px;border-width:4.5px;box-shadow:0 6px 0 var(--ol),0 0 0 6px #fff,0 0 0 10px var(--ol);animation:bounce 1.6s ease-in-out infinite}
#nav button.on:before{content:'⭐';position:absolute;top:-14px;right:2px;font-size:19px;animation:twk 1.4s infinite;-webkit-text-stroke:0}
#nav button.on b{background:var(--y);color:var(--ol);-webkit-text-stroke:0;border:3px solid var(--ol);border-radius:12px;padding:0 8px;font-size:13px;margin-top:6px}
#nav button:active span{transform:scale(.88)}
@media(max-width:380px){#nav button span{width:44px;height:44px;font-size:22px}#nav button.on span{width:56px;height:56px;font-size:30px}#nav button{font-size:10px}}

/* ---------- landscape / TV ---------- */
@media (orientation:landscape) and (min-width:640px){
  :root{--navH:0px}
  #shell{flex-direction:row}
  #nav{position:relative;flex:none;height:auto;width:104px;flex-direction:column;justify-content:center;align-items:center;gap:6px;margin:10px 10px 10px 0;border:4px solid var(--ol);border-radius:34px;padding:10px 4px}
  #nav:after{display:none}
  #nav button{flex:none}
  #nav button.on{transform:translateX(-8px)}
  #view{padding-bottom:30px}
  #view>*{max-width:1200px}
  .hills{height:110px}
}


/* ---------- pieces ---------- */
.card{background:#fff;border-radius:28px;border:3.5px solid var(--ol);box-shadow:0 6px 0 var(--ol)}
h2.t,.ttl{font-size:30px;margin:6px auto 10px;text-align:center;color:#fff;-webkit-text-stroke:7px var(--ol);paint-order:stroke fill;line-height:1.3}
.sub{text-align:center;font-size:15px;background:#fff;border:3px solid var(--ol);border-radius:16px;padding:2px 14px;width:fit-content;max-width:100%;margin:0 auto 14px}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px auto}
.btn{--c:var(--y);display:inline-flex;align-items:center;gap:8px;justify-content:center;padding:11px 20px;border-radius:24px;font-size:18px;font-weight:800;color:var(--ol);background:var(--c);border:4px solid var(--ol);box-shadow:0 6px 0 var(--ol);transition:transform .1s,box-shadow .1s;position:relative;overflow:hidden}
.btn:before{content:'';position:absolute;top:5px;left:12px;width:30px;height:10px;border-radius:50%;background:#ffffff88;transform:rotate(-15deg);pointer-events:none}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ol)}
.btn.sm{padding:7px 13px;font-size:15px;border-radius:18px;border-width:3.5px;box-shadow:0 4px 0 var(--ol)}
.b-r{--c:#ff595e}.b-g{--c:#6bcb77}.b-b{--c:#4cc9f0}.b-y{--c:#ffd93d}.b-p{--c:#ff5da2}.b-o{--c:#ff8e3c}.b-t{--c:#2ec4b6}.b-w{--c:#fff}
@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg) scale(1.05)}75%{transform:rotate(8deg) scale(1.05)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes squish{0%{transform:scale(1)}30%{transform:scale(1.22,.82)}60%{transform:scale(.92,1.12)}100%{transform:scale(1)}}
@keyframes popIn{from{opacity:0;transform:scale(.4) rotate(-10deg)}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
@keyframes twk{50%{opacity:.25;transform:scale(.6)}}
@keyframes blink{0%,44%,48%,100%{transform:scaleY(1)}46%{transform:scaleY(.1)}}
.sq{animation:squish .45s}

/* ---------- kid mascot ---------- */
.owl{width:110px;height:126px;flex:none;overflow:visible;cursor:pointer;animation:bounce 2.8s ease-in-out infinite}
.owl .eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
.owl .pup{transform:translate(var(--px,0px),var(--py,0px));transition:transform .15s}
.owl .page{transform-box:fill-box;transform-origin:left center;animation:flip 3.4s ease-in-out infinite}
.owl .head{transform-box:fill-box;transform-origin:50% 90%;animation:wob2 4.5s ease-in-out infinite}
.owl .spark{transform-box:fill-box;transform-origin:center;animation:twk 1.6s ease-in-out infinite}.owl .spark:nth-of-type(2){animation-delay:-.6s}.owl .spark:nth-of-type(3){animation-delay:-1.1s}
.owl .mo{transform-box:fill-box;transform-origin:top center}
body.talking .owl .mo{animation:mouth .18s infinite alternate}
.owl.tick{animation:wob .6s}
@keyframes mouth{to{transform:scaleY(1.9)}}
@keyframes flip{0%,30%{transform:scaleX(1)}50%{transform:scaleX(-1)}75%,100%{transform:scaleX(1)}}
@keyframes wob2{0%,100%{transform:rotate(0)}30%{transform:rotate(-5deg)}60%{transform:rotate(4deg)}}
.bot{display:flex;align-items:center;gap:6px;margin:2px auto 14px}
.speech{position:relative;flex:1;background:#fff;border-radius:26px;padding:12px 16px;font-size:19px;line-height:1.5;min-height:58px;border:3.5px solid var(--ol);box-shadow:0 5px 0 var(--ol)}
.speech:after{content:'';position:absolute;right:-17px;top:24px;border:11px solid transparent;border-left:16px solid var(--ol);border-right:0}
.speech:before{content:'';position:absolute;right:-11px;top:27px;border:8px solid transparent;border-left:12px solid #fff;border-right:0;z-index:1}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;text-align:center;padding:20px;background:linear-gradient(180deg,#43c6ff,#b8f0ff 70%)}
#splash .owl{width:min(240px,34vh);height:min(280px,40vh)}
#splash h1{font-size:clamp(40px,10vw,64px);margin:0;line-height:1.1;color:#fff;-webkit-text-stroke:10px var(--ol);paint-order:stroke fill}
#splash h1 span{color:var(--y)}
.ver{font-size:13px;background:#fff;border:3px solid var(--ol);border-radius:12px;padding:0 10px}
.startbtn{font-size:26px!important;padding:12px 42px!important;margin-top:6px;animation:pulse 1.4s infinite}
.balloons{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.balloons span{position:absolute;bottom:-90px;font-size:46px;animation:rise2 linear infinite}
@keyframes rise2{to{transform:translateY(-120vh) rotate(15deg)}}
@media (orientation:landscape) and (max-height:520px){#splash{flex-direction:row;flex-wrap:wrap;gap:4px 20px}#splash .owl{width:170px;height:196px}}

/* ---------- home ---------- */
.hgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(148px,1fr));gap:14px}
@media (orientation:landscape) and (min-width:640px){.hgrid{grid-template-columns:repeat(4,1fr)}}
.hm{position:relative;border:4px solid var(--ol);border-radius:30px;background:var(--c);box-shadow:0 7px 0 var(--ol);padding:12px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:6px;overflow:hidden;animation:popIn .5s backwards;transition:transform .1s}
.hm:after{content:'';position:absolute;top:8px;left:14px;width:46px;height:16px;border-radius:50%;background:#ffffff88;transform:rotate(-20deg)}
.hm:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ol)}
.hm .ic{width:82px;height:82px;border-radius:50%;background:#fff;border:4px solid var(--ol);display:grid;place-items:center;font-size:48px;animation:bounce 2.6s ease-in-out infinite}
.hm:nth-child(2n) .ic{animation-delay:-1.2s}
.hm .ic.wob{animation:wob .7s}
.hm b{font-size:20px;color:#fff;-webkit-text-stroke:5px var(--ol);paint-order:stroke fill}
.hm.wide{grid-column:span 2;flex-direction:row;justify-content:center;gap:14px}
.hm.wide .tx{display:flex;flex-direction:column;align-items:flex-start;gap:3px}
.hm small{font-size:13px;color:var(--ol);background:#fff;border:2.5px solid var(--ol);border-radius:12px;padding:0 10px}
.newb{position:absolute;top:8px;right:10px;background:var(--r);color:#fff;border:3px solid var(--ol);border-radius:12px;padding:0 8px;font-size:13px;transform:rotate(8deg);z-index:1}
.topcards{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:16px auto 8px}
.mini{padding:10px 12px;font-size:14px}
.mini h4{margin:0 0 6px;font-size:16px;display:flex;align-items:center;gap:6px}
.mrow{display:flex;align-items:center;gap:6px;margin:4px 0;font-size:13px}
.mrow span{flex:none;width:26px;text-align:center;font-size:18px}
.bar{flex:1;height:14px;border-radius:9px;background:#efe6ff;overflow:hidden;border:2.5px solid var(--ol)}
.bar i{display:block;height:100%;background:var(--o);transition:width .6s}
.mrow.ok .bar i{background:var(--g)}
.giftc{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px}
.giftc .e{font-size:44px;animation:wob 2.4s infinite}
.todaychip{display:flex;align-items:center;gap:10px;padding:10px 14px;margin:0 auto 12px;font-size:16px}
.todaychip .btn{margin-inline-start:auto}

/* chips */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.chip{--c:#4cc9f0;padding:12px 8px;border-radius:26px;font-size:18px;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--c);color:#fff;-webkit-text-stroke:4px var(--ol);paint-order:stroke fill;border:4px solid var(--ol);box-shadow:0 7px 0 var(--ol);animation:popIn .45s backwards;transition:transform .1s}
.chip .e{font-size:44px;-webkit-text-stroke:0;width:70px;height:70px;border-radius:50%;background:#fff;border:3.5px solid var(--ol);display:grid;place-items:center;animation:bounce 2.5s ease-in-out infinite}
.chip:active{transform:translateY(5px);box-shadow:0 2px 0 var(--ol)}


/* onboarding */
.gender{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:10px auto}
.gender button{padding:18px 8px;font-size:26px}
.gender .e{font-size:70px!important;width:110px!important;height:110px!important}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px;margin-top:10px}
.names button{padding:10px 4px;border-radius:20px;font-size:18px;background:#fff;border:3.5px solid var(--ol);box-shadow:0 4px 0 var(--ol);animation:popIn .35s backwards}
.names button.sel{background:var(--y)}
.field{display:flex;flex-direction:column;gap:6px;text-align:start;margin:12px 0;font-size:16px}
.field input[type=text]{padding:12px 16px;border-radius:18px;border:3.5px solid var(--ol);background:#fff;color:var(--ink);font:inherit;font-size:19px}
.field input[type=range]{width:100%;accent-color:var(--v)}

/* book */
.chap{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.chap button{border-radius:24px;overflow:hidden;background:#fff;border:3.5px solid var(--ol);box-shadow:0 5px 0 var(--ol);padding:0 0 8px;animation:popIn .45s backwards;transition:transform .1s}
.chap button:active{transform:translateY(4px)}
.chap img{width:100%;height:120px;object-fit:cover;object-position:top;display:block;margin-bottom:6px;border-bottom:3px solid var(--ol)}
.chap b{font-size:16px;display:block;padding:0 6px}.chap small{color:var(--mut);font-size:12px}
.pghead{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:8px 14px}
.pghead b{font-size:19px;flex:1}
.pgnum{font-size:14px;padding:2px 12px;border-radius:12px;background:var(--y);border:2.5px solid var(--ol)}
.pgwrap{position:relative;border-radius:24px;overflow:auto;border:4px solid var(--ol);box-shadow:0 7px 0 var(--ol);max-width:min(100%,560px)!important;margin:0 auto}
@media (orientation:landscape){.pgwrap{max-width:min(100%,68vh)!important}}
.pg{position:relative;width:100%;background:#fff;transition:width .3s}
.pg.zoom{width:170%}
.pg img{display:block;width:100%;pointer-events:none}
.hs{position:absolute;border-radius:16px;cursor:pointer}
.hs:after{content:'👆';position:absolute;left:50%;top:50%;font-size:22px;margin:-14px;animation:tapme 1.6s infinite}
.hs.f:after{content:'⭐';animation:none;font-size:18px}
.hs.on{background:#ffd93d66;outline:5px solid var(--y)}
.hs.ok{background:#3ec46d55;outline:5px solid var(--ok)}
.hs.no{animation:shake .4s}
@keyframes tapme{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-6px) scale(1.15)}}
.wlabel{position:absolute;transform:translate(-50%,-100%);background:var(--p);color:#fff;border:3px solid var(--ol);padding:2px 14px;border-radius:18px;font-size:22px;white-space:nowrap;pointer-events:none;animation:lbl 1.6s forwards;z-index:3;box-shadow:0 4px 0 var(--ol)}
@keyframes lbl{0%{opacity:0;transform:translate(-50%,-60%) scale(.5)}15%{opacity:1;transform:translate(-50%,-110%) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-150%)}}
.found{display:flex;align-items:center;gap:10px;margin:10px auto;font-size:15px;padding:10px 14px}
.lines{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px auto}
.ln{padding:8px 16px;border-radius:20px;background:#fff;border:3px solid var(--ol);box-shadow:0 4px 0 var(--ol);font-size:21px;transition:all .2s}
.ln.on{background:var(--y);transform:scale(1.06)}
.ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px;margin-top:10px}

/* letters */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:11px}
.lt{--c:#4cc9f0;position:relative;aspect-ratio:1;border-radius:24px;font-size:46px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--c);color:#fff;-webkit-text-stroke:6px var(--ol);paint-order:stroke fill;border:4px solid var(--ol);box-shadow:0 6px 0 var(--ol);animation:popIn .4s backwards;transition:transform .1s}
.lt:active{transform:translateY(4px);box-shadow:0 2px 0 var(--ol)}
.lt small{font-size:11px;margin-top:3px;-webkit-text-stroke:3px var(--ol)}
.lt .dots{position:absolute;bottom:5px;display:flex;gap:3px}
.lt .dots i{width:8px;height:8px;border-radius:50%;background:#ffffff99;border:1.5px solid var(--ol)}.lt .dots i.y{background:var(--y)}
.lt .crown{position:absolute;top:-14px;left:-6px;font-size:24px;-webkit-text-stroke:0;animation:wob 2s infinite}

function tone(f,d=.12,type='sine',v=.15,when=0,slide=0){const a=ac();if(!a||!S.sfx)return;const t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03)}

function tts(t){return new Promise(res=>{let done=0;const r=()=>{if(!done){done=1;clearTimeout(w);res()}};let w=setTimeout(r,Math.max(3500,t.length*420));
  if(window.AndroidTTS&&AndroidTTS.ok&&AndroidTTS.ok()){const id='t'+(++ttsId);ttsWait[id]=r;curRes=r;try{AndroidTTS.speak(id,t,S.rate)}catch(e){r()}return}
  const ss=window.speechSynthesis;if(!ss||!voice){netTTS(t,r);return}
  try{ss.cancel();ss.resume()}catch(e){}
  setTimeout(()=>{const u=new SpeechSynthesisUtterance(t);KEEP=u;u.lang=voice.lang;u.voice=voice;u.rate=S.rate*.9;u.pitch=1.15;u.onend=r;u.onerror=e=>{if(e&&(e.error==='interrupted'||e.error==='canceled'))r();else netTTS(t,r)};try{ss.speak(u)}catch(e){netTTS(t,r)}},60)})}

async function aget(k){try{const d=await idb();return await new Promise(r=>{const q=d.transaction('a').objectStore('a').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})}catch(e){}}
async function aset(k,b){try{const d=await idb();await new Promise(r=>{const tx=d.transaction('a','readwrite');tx.objectStore('a').put(b,k);tx.oncomplete=r;tx.onerror=r});RC.add(k)}catch(e){}}

function playSrc(src,isBlob){return new Promise(r=>{try{const a=new Audio(src);curAud=a;curRes=r;a.playbackRate=S.rate<.85?.9:1;a.onended=()=>{if(isBlob)URL.revokeObjectURL(src);r()};a.onerror=()=>r('err');a.play().catch(()=>r('err'))}catch(e){r('err')}})}
const has=k=>RC.has(k)||VSET.has(hsh(k));
async function playKey(k){if(RC.has(k)){const b=await aget(k);if(b)return playSrc(URL.createObjectURL(b),1)}if(VSET.has(hsh(k))){const e=await playSrc('voices/'+hsh(k)+'.mp3');if(e!=='err')return}return tts(k)}

function stop(){tok++;try{speechSynthesis.cancel()}catch(e){}try{window.AndroidTTS&&AndroidTTS.stop()}catch(e){}if(curAud){try{curAud.pause()}catch(e){}curAud=null}if(curRes){const r=curRes;curRes=null;r()}Object.keys(ttsWait).forEach(k=>{ttsWait[k]();delete ttsWait[k]})}
async function say(t,show){if(t==null)return;const parts=(Array.isArray(t)?t:[t]).filter(Boolean),full=parts.join(' ');
  if(REC&&Date.now()-lastTap<800&&!$('.shade')){lastTap=0;openRec(parts.length>1?[full,...parts]:[full]);return}
  if(show!==false)$$('.live').forEach(e=>typeIn(e,full));
  const t0=tok;talk(1);
  try{if(has(full))return await playKey(full);
    if(parts.length>1&&parts.some(has)){for(const p of parts){if(t0!==tok)return;await playKey(p)}return}
    await tts(full)}finally{talk(-1)}}

/* ================= wish (gift) ================= */
function askWish(){return new Promise(res=>{const sh=document.createElement('div');sh.className='shade';
  sh.innerHTML=`<div class=sheet><div style="display:flex;justify-content:center">${OWL}</div><h3 class=live>${esc(WISH_Q())}</h3><div class=gifts>${GIFTS.map((g,i)=>`<button style="animation-delay:${i*.03}s"><span class=e>${g[0]}</span>${g[1]}</button>`).join('')}</div><button class="btn sm b-w" id=skip>بعدين</button></div>`;
  document.body.appendChild(sh);
  bind(sh,'.gifts button',async(e,i)=>{S.wish={d:todayStr(),i};S.wishes.unshift({d:todayStr(),i});S.wishes=S.wishes.slice(0,20);save();sq(e);SFX.ok();confetti(e,0,24,[GIFTS[i][0],'🎉','⭐','💖']);$('.gifts',sh).style.pointerEvents='none';await say(WISH_OK(GIFTS[i][1]));sh.remove();if(cur&&cur[0]==='home')go('home',null,1);res()});
  $('#skip',sh).onclick=()=>{stop();sh.remove();res()};sh.onclick=e=>{if(e.target===sh){stop();sh.remove();res()}};
  setTimeout(()=>say(WISH_Q(),false),200)})}
let lastRem=0;async function wishGate(){const w=wishToday();if(!w)await askWish();else if(Date.now()-lastRem>8*60e3){lastRem=Date.now();toast(w[0],WISH_REM(w[1]));await say(WISH_REM(w[1]))}}

let BK={i:0,busy:false};
SCR.book=(v,a)=>{let start=a&&a.p!=null?a.p:(S.bk||0);if(typeof a==='number')start=a;BK.i=Math.max(0,Math.min(BOOK.length-1,start));
  v.innerHTML=`<div class=bkwrap><div class=book id=book><div class=bspine></div></div></div>
   <div class=bkfoot><button class="bknav prev" id=bkPrev aria-label="الصفحة السابقة">${ic('back')}</button><div class=bkbar><i id=bkProg></i></div><span id=bkNum></span><button class="bknav next" id=bkNext aria-label="الصفحة الجاية">${ic('back')}</button></div>`;
  const book=$('#book');
  const mount=(i,under)=>{const el=document.createElement('div');el.className='bpage';el.innerHTML=renderPage(i);if(under)book.insertBefore(el,book.firstChild.nextSibling);else book.appendChild(el);wirePage(el,i);return el};
  const setFoot=()=>{$('#bkNum').textContent=AR(BK.i+1)+' / '+AR(BOOK.length);$('#bkProg').style.width=((BK.i+1)/BOOK.length*100)+'%';$('#bkPrev').disabled=BK.i===0;$('#bkNext').disabled=BK.i===BOOK.length-1};
  const visit=i=>{S.bk=i;if(!S.pages[i]){S.pages[i]=1}save();if(!seenToday.has(i)){seenToday.add(i);progress('p');checkBadges()}};
  let curEl=mount(BK.i);setFoot();visit(BK.i);setTimeout(()=>sayPage(BK.i),350);
  const turn=dir=>{const ni=BK.i+dir;if(BK.busy||ni<0||ni>=BOOK.length)return;stop();BK.busy=true;SFX.flip();
    if(dir>0){const nx=mount(ni,true);const old=curEl;old.classList.add('turning');
      old.animate([{transform:'rotateY(0deg)',filter:'brightness(1)'},{transform:'rotateY(-165deg)',filter:'brightness(.7)'}],{duration:650,easing:'cubic-bezier(.45,.05,.3,1)',fill:'forwards'}).onfinish=()=>{old.remove();curEl=nx;BK.busy=false}}
    else{const nx=mount(ni,false);nx.classList.add('turning');const old=curEl;
      nx.animate([{transform:'rotateY(-165deg)',filter:'brightness(.7)'},{transform:'rotateY(0deg)',filter:'brightness(1)'}],{duration:650,easing:'cubic-bezier(.45,.05,.3,1)',fill:'forwards'}).onfinish=()=>{old.remove();nx.classList.remove('turning');curEl=nx;BK.busy=false}}
    BK.i=ni;setFoot();visit(ni);setTimeout(()=>sayPage(ni),500)};
  BK.turn=turn;BK.jump=i=>{if(i===BK.i)return;stop();const old=curEl;curEl=mount(i);old.remove();BK.i=i;setFoot();visit(i);sayPage(i)};
  $('#bkNext').onclick=()=>turn(1);$('#bkPrev').onclick=()=>turn(-1);
  let sx=null,sy=null;book.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;sx=e.clientX;sy=e.clientY});
  book.addEventListener('pointerup',e=>{if(sx==null)return;const dx=e.clientX-sx,dy=e.clientY-sy;sx=null;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.3)turn(dx>0?1:-1)});
  const kd=e=>{if(e.key==='PageDown')turn(1);if(e.key==='PageUp')turn(-1)};document.addEventListener('keydown',kd);LEAVE.push(()=>document.removeEventListener('keydown',kd))};
SCR.page=(v,a)=>SCR.book(v,{p:typeof a==='object'?a.i:a});
function sayPage(i){if(i===0)return say('قراءتي الجديدة');if(i===1)return;say(bTitle(i))}

function renderPage(i){const p=BOOK[i];
  if(p.k==='cover')return`<div class=bcover><div class=bcv-kid>${OWL}</div><div class=bcv-t>قراءتي<br><span>الجديدة</span></div><button class="bplay big" data-act=open aria-label="افتح الكتاب">${ic('play')}</button></div>`;
  if(p.k==='toc')return`<div class=bhead><b>الفهرس</b></div><div class=btoc>${BCH.slice(1).map((c,k)=>{const first=BOOK.findIndex(x=>x.c===k+1);return`<button class=btc data-go=${first} style="--c:${c[1]}"><span class=bti>${ic(c[2])}</span><b>${c[0]}</b><em>${AR(first+1)}</em></button>`}).join('')}</div>`;
  const ch=BCH[p.c];
  return`<div class=bhead style="--c:${ch[1]}"><span class=bchip>${ic(ch[2])}</span><b>${esc(bTitle(i))}</b><button class=bplay data-act=title aria-label="اسمع">${ic('speaker')}</button></div>
   <div class=bbody>${p.b.map((b,k)=>renderBlock(b,k)).join('')}</div><div class=bpn>${AR(i+1)}</div>`}

function renderBlock(b,k){
  if(b.k==='lines')return`<div class="bblk blines ${b.poem?'poem':''}" data-b=${k}><button class=bplay data-act=lines aria-label="اقرا">${ic('play')}</button>${b.l.map((l,j)=>`<button class=bl data-j=${j}>${esc(l)}</button>`).join('')}</div>`;
  if(b.k==='words'||b.k==='sounds')return`<div class="bblk bwords" data-b=${k}>${b.w.map((w,j)=>`<button class=bw data-j=${j} style="--c:${BLC[(j+k)%8]}"><span class=be>${BE[w]||emojiOf(w)||`<span class=bltr>${w[0]}</span>`}</span><b>${b.k==='sounds'?esc(w):hlWord(w,b.h)}</b></button>`).join('')}</div>`;
  if(b.k==='letter')return`<div class="bblk bletter" data-b=${k}><button class=bL data-act=L>${b.c}</button><div class=bhar>${HAR(b.c).map((s,j)=>`<button data-j=${j} style="--c:${BLC[j]}">${s}</button>`).join('')}</div></div>`;
  if(b.k==='build'){const w=b.w||b.p.join('');return`<div class="bblk bbuild" data-b=${k}><span class=be>${BE[w]||''}</span><div class=bslots>${b.p.map(()=>'<i></i>').join('')}</div><div class=btiles>${shuf(b.p.map((x,j)=>[x,j])).map(([x,j])=>`<button data-j=${j}>${x}</button>`).join('')}</div></div>`}
  if(b.k==='pick')return`<div class="bblk bpick" data-b=${k}><button class=bq data-act=q>${ic('speaker')}<span>${esc(b.q)}</span></button><div class=bopts>${b.o.map((o,j)=>`<button data-j=${j} style="${b.sz?`font-size:${b.sz[j]}px`:''}">${o}</button>`).join('')}</div></div>`;
  if(b.k==='places')return`<div class="bblk bplaces" data-b=${k}><div class=bstage><span class=bbox>📦</span><span class=bcat data-pos=up>🐱</span></div><div class=bpos>${[['up','فوق'],['down','تحت'],['front','أمام'],['back','خلف']].map(x=>`<button data-p=${x[0]}>${x[1]}</button>`).join('')}</div></div>`;
  if(b.k==='dirs')return`<div class="bblk bdirs" data-b=${k}><button data-d=r><span>✋</span><b>يمين</b></button><button data-d=l><span style="transform:scaleX(-1)">✋</span><b>يسار</b></button></div>`;
  if(b.k==='trace')return`<div class="bblk btrace" data-b=${k}><button class=btr data-c="${b.c}">${ic('pencil')}<span>${b.c}</span></button></div>`;
  return''}

function wirePage(el,i){const p=BOOK[i];
  const pop=(e,set)=>{e.classList.remove('bpop');void e.offsetWidth;e.classList.add('bpop');confetti(e,0,8,set||['⭐','✨'])};
  $$('[data-act=open]',el).forEach(b=>b.onclick=()=>BK.turn(1));
  $$('[data-act=title]',el).forEach(b=>b.onclick=()=>{pop(b);say(bTitle(i))});
  $$('.btc',el).forEach(b=>b.onclick=()=>{pop(b);BK.jump(+b.dataset.go)});
  if(!p.b)return;
  p.b.forEach((b,k)=>{const B=$(`[data-b="${k}"]`,el);if(!B)return;
    if(b.k==='lines'){const ls=$$('.bl',B);const one=async j=>{ls.forEach(x=>x.classList.remove('on'));ls[j].classList.add('on');await say(b.l[j]);ls[j].classList.remove('on')};
      ls.forEach((x,j)=>x.onclick=()=>{stop();one(j)});
      $('[data-act=lines]',B).onclick=async e=>{stop();const t=tok;pop(e.currentTarget);for(let j=0;j<ls.length;j++){if(t!==tok)return;await one(j);await sleep(200)}}}
    if(b.k==='words'||b.k==='sounds'){const cards=$$('.bw',B);let found=new Set();
      cards.forEach((c,j)=>c.onclick=async()=>{stop();pop(c);SFX.pop();const w=b.w[j];
        if(b.k==='sounds'){const lt=[...w];const bb=$('b',c);bb.innerHTML=lt.map((x,q)=>`<span class="${q===0?'hl':''}">${x}</span>`).join(' ');setTimeout(()=>{bb.textContent=w},2200)}
        say(w);if(!found.has(j)){found.add(j);c.classList.add('done');addXP(1,c);if(found.size===cards.length){setTimeout(()=>{SFX.ok();confetti(B,0,30);addStars(1,B);say(pr())},900)}}})}
    if(b.k==='letter'){const L=letObj(b.c);$('.bL',B).onclick=e=>{pop(e.currentTarget);say('حرف '+L[1])};$$('.bhar button',B).forEach((x,j)=>x.onclick=()=>{pop(x);say(HAR(b.c)[j])})}
    if(b.k==='build'){const w=b.w||b.p.join(''),slots=$$('.bslots i',B),tiles=$$('.btiles button',B);let got=[];
      tiles.forEach(t=>t.onclick=async()=>{if(t.classList.contains('used'))return;const j=+t.dataset.j;
        if(j!==got.length){SFX.bad();shake(t);return}
        SFX.pop();t.classList.add('used');slots[got.length].textContent=b.p[j];slots[got.length].classList.add('f');got.push(j);say(b.p[j].replace('ـ',''),false);
        if(got.length===b.p.length){await sleep(450);B.classList.add('ok');$('.bslots',B).innerHTML=`<span class=bwdone>${w}</span>`;SFX.ok();confetti(B,0,24);addXP(3,B);await say(w);say(pr(),false)}})}
    if(b.k==='pick'){const opts=$$('.bopts button',B);let ok=0;$('[data-act=q]',B).onclick=()=>say(b.q);
      opts.forEach((o,j)=>o.onclick=()=>{if(B.classList.contains('ok'))return;
        const right=b.two?(o.textContent===b.o[b.a]):j===b.a;
        if(right){o.classList.add('right');pop(o);SFX.ok();ok++;if(!b.two||ok>=2){B.classList.add('ok');addXP(2,o);say(pr(),false)}}else{o.classList.add('wrong');SFX.bad();setTimeout(()=>o.classList.remove('wrong'),600);say(oops(),false)}})}
    if(b.k==='places'){const cat=$('.bcat',B);$$('.bpos button',B).forEach(x=>x.onclick=()=>{pop(x);cat.dataset.pos=x.dataset.p;SFX.whoosh();say(x.textContent)})}
    if(b.k==='dirs')$$('button',B).forEach(x=>x.onclick=()=>{pop(x);say($('b',x).textContent)});
    if(b.k==='trace')$('.btr',B).onclick=()=>go('trace',{c:b.c,p:0});
  })}

async function qRun(n,startI,o){stop();const t=tok,D=QD(n),N=D.u.length,rep=o.rep||1;let i=startI;
  if(D.f&&D.t&&!D.a){const a=qAudio(D.f),T=D.t;curAud=a;curRes=null;a.volume=1;
    await qSeek(a,T[i][0]/1000);if(t!==tok)return'stop';o.onAyah&&o.onAyah(i);
    try{await a.play()}catch(e){return'stop'}curAud=a;
    let r=1;
    const FD=170;
    while(t===tok){await sleep(25);const ms=a.currentTime*1000,last=i>=N-1;
      const pm=(!o.single&&!last&&r>=rep&&o.pause)?o.pause(i,T[i][1]-T[i][0]):0;
      const stopping=r<rep||o.single||last||pm>0;
      if(a.ended||ms>=T[i][1]-(stopping?FD:25)){
        if(r<rep){r++;await qFade(a,0,FD);a.pause();await qSeek(a,T[i][0]/1000);if(t!==tok)return'stop';a.volume=0;try{await a.play()}catch(e){return'stop'}curAud=a;qFade(a,1,FD);continue}
        r=1;
        if(o.single||last){await qFade(a,0,FD);a.pause();a.volume=1;return last?'end':'one'}
        if(pm){await qFade(a,0,FD);a.pause();o.onTurn&&o.onTurn(i);if(!await waitT(pm,t))return'stop'}
        i++;o.onAyah&&o.onAyah(i);
        if(a.paused){await qSeek(a,T[i][0]/1000);if(t!==tok)return'stop';a.volume=0;try{await a.play()}catch(e){return'stop'}curAud=a;qFade(a,1,FD)}
      }}
    return'stop'}
  /* per-ayah files */
  for(;i<N;i++){o.onAyah&&o.onAyah(i);
    for(let r=0;r<rep;r++){if(i===0&&r===0&&n!==1&&window.QURAN_DATA.bsm){await qClip(window.QURAN_DATA.bsm);if(t!==tok)return'stop'}
      const t1=Date.now();await qClip(D.a[i]);if(t!==tok)return'stop';
      if(r===rep-1&&!o.single&&i<N-1){const pm=o.pause?o.pause(i,Date.now()-t1):0;if(pm){o.onTurn&&o.onTurn(i);if(!await waitT(pm,t))return'stop'}}}
    if(o.single)return'one'}
  return'end'}
function qClip(src){return new Promise(r=>{if(!src)return r();const a=new Audio(src);let d=0;const fin=()=>{if(!d){d=1;r()}};curAud=a;curRes=fin;a.onended=fin;a.onerror=fin;a.play().catch(fin)})}

(function(){const vis=el=>{if(el.disabled||el.closest('[hidden]'))return false;const r=el.getBoundingClientRect();return r.width>0&&r.height>0&&r.bottom>0&&r.top<innerHeight+400};
  const D={ArrowUp:[0,-1],ArrowDown:[0,1],ArrowLeft:[-1,0],ArrowRight:[1,0]};
  document.addEventListener('pointerdown',()=>document.body.classList.remove('kbd'),true);
  document.addEventListener('keydown',e=>{const k=e.key;const ae=document.activeElement;if(ae&&ae.tagName==='INPUT'&&(k==='ArrowLeft'||k==='ArrowRight'))return;
    if(D[k]){document.body.classList.add('kbd');const scope=$('.shade')||document;const cand=$$('button,[tabindex="0"],input,label.btn',scope).filter(vis);
      const cur=ae&&cand.includes(ae)?ae:null;e.preventDefault();
      if(!cur){const f=cand.find(x=>x.closest('#view'))||cand[0];f&&f.focus();return}
      const r=cur.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,[dx,dy]=D[k];let best=null,bs=1e9;
      for(const el of cand){if(el===cur)continue;const q=el.getBoundingClientRect(),vx=q.left+q.width/2-cx,vy=q.top+q.height/2-cy,along=vx*dx+vy*dy;if(along<=6)continue;if(Math.abs(vx*dy-vy*dx)>along*3)continue;const sc=along+Math.abs(vx*dy-vy*dx)*2.5;if(sc<bs){bs=sc;best=el}}
      if(best){best.focus({preventScroll:true});best.scrollIntoView({block:'nearest',inline:'nearest',behavior:'smooth'})}}
    else if((k==='Enter'||k===' ')&&ae&&ae!==document.body&&ae.tagName!=='BUTTON'&&ae.tagName!=='INPUT'){e.preventDefault();ae.click()}
    else if(k==='Escape'||k==='BrowserBack'||k==='GoBack'){if(window.appBack)appBack()}});
})();

  say(G2('هاي جوائزك','هاي جوائزج'))};
$('#setBtn').onclick=()=>{const sh=document.createElement('div');sh.className='shade';sh.innerHTML=`<div class=sheet><h3>⚙️ الإعدادات</h3>
  <div class=card style="padding:12px;margin:8px 0"><div style="font-size:15px;color:var(--mut)">اسم الطفل</div><div style="font-size:26px">${G2('👦','👧')} ${esc(S.name)}</div><div class=row><button class="btn sm b-p" id=chn>✏️ غيّر الاسم</button><button class="btn sm b-r" id=rcn>🎙️ سجّل الاسم بصوتك</button></div></div>
  <button class="btn b-t" id=qmS style="width:100%;margin:6px 0">${ic('mosque')} طريقة قراءة القرآن</button>
  <label class=field>سرعة الصوت: <b id=rv>${S.rate}</b><input type=range id=rt min=.6 max=1.2 step=.05 value=${S.rate}></label>
  <div class=row><button class="btn sm ${S.sfx?'b-g':'b-w'}" id=sf>${S.sfx?'🔔 المؤثرات شغالة':'🔕 المؤثرات طافية'}</button><button class="btn sm b-b" id=ts>🔊 جرّب الصوت</button></div>
  <div class=sub style="margin:6px 0">${VSET.size?`🔵 الأصوات الجاهزة: ${VSET.size}`:(window.AndroidTTS?'🗣️ صوت التلفون':voice?'🗣️ '+esc(voice.name):'⚠️ ماكو أصوات جاهزة ولا صوت عربي بالجهاز')}</div>
  <div class=row><button class="btn b-g" id=ok>✅ تمام</button><button class="btn sm b-w" id=rs>♻️ صفّر التقدّم</button></div></div>`;document.body.appendChild(sh);
  $('#rt',sh).oninput=e=>{S.rate=+e.target.value;$('#rv',sh).textContent=S.rate};
  $('#sf',sh).onclick=e=>{S.sfx=S.sfx?0:1;e.currentTarget.textContent=S.sfx?'🔔 المؤثرات شغالة':'🔕 المؤثرات طافية';e.currentTarget.className='btn sm '+(S.sfx?'b-g':'b-w')};
  $('#ts',sh).onclick=()=>say(GREET(),false);
  $('#qmS',sh).onclick=()=>{save();sh.remove();qModeSheet()};
  $('#chn',sh).onclick=()=>{save();sh.remove();go('onboard',{s:1,back:1})};
  $('#rcn',sh).onclick=()=>{sh.remove();openRec([S.name])};
  $('#rs',sh).onclick=()=>{if(confirm('أكيد تريد تصفّر النجوم والتقدّم؟ (الاسم والأصوات تبقى)')){const k={ob:S.ob,name:S.name,g:S.g};S=Object.assign(JSON.parse(JSON.stringify(DEF)),k);save();sh.remove();go('home')}};
  const close=()=>{save();sh.remove();if(cur&&cur[0]==='home')go('home',null,1)};
  $('#ok',sh).onclick=close;sh.onclick=e=>{if(e.target===sh)close()}};

/* ================= boot ================= */
load();
(function(){const t=todayStr();if(S.last!==t){S.streak=S.last===todayStr(-1)?S.streak+1:1;S.last=t}ensureDay();save()})();
loadKeys().then(checkBadges);hud();
</script>
</body>
