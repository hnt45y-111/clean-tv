<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="referrer" content="no-referrer">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#7fd3ff">
<title>مغامرة القراءة</title>
<link href="fonts/fonts.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@600;700;800&display=swap" rel="stylesheet">
<script src="voices/index.js"></script>
<style>
:root{
  --ink:#3b2a63;--mut:#7a6aa8;--line:#e7defc;--card:#fff;
  --sun:#ffd23f;--red:#ff6b6b;--grn:#3ec46d;--blu:#4d96ff;--pur:#9b5de5;--pnk:#f15bb5;--org:#ff9f1c;--tel:#1fc7c1;
  --ok:#3ec46d;--bad:#ff5a5f;
  --f:'Baloo Bhaijaan 2','Cairo','Segoe UI',Tahoma,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;color:var(--ink);font-family:var(--f);font-weight:700;overflow-x:hidden}
body{background:linear-gradient(180deg,#6cc8ff 0%,#a9e2ff 45%,#dff5ff 75%,#e9fbe6 100%);background-attachment:fixed;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation;padding:0}
button:focus-visible{outline:4px solid var(--org);outline-offset:3px}
[hidden]{display:none!important}

/* ---------- scenery ---------- */
#scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.sun{position:absolute;top:-40px;left:-40px;width:170px;height:170px;border-radius:50%;background:radial-gradient(circle,#fff6b0 0 35%,#ffd23f 36% 52%,transparent 53%)}
.sun:before{content:'';position:absolute;inset:-10px;border-radius:50%;background:repeating-conic-gradient(#ffe16e55 0 10deg,transparent 10deg 22deg);animation:spin 30s linear infinite;z-index:-1}
.cloud{position:absolute;width:120px;height:40px;background:#fff;border-radius:40px;opacity:.95;animation:drift linear infinite;box-shadow:0 6px 0 #d8f0ff}
.cloud:before,.cloud:after{content:'';position:absolute;background:#fff;border-radius:50%}
.cloud:before{width:56px;height:56px;top:-28px;left:18px}.cloud:after{width:42px;height:42px;top:-18px;left:62px}
@keyframes drift{from{transform:translateX(110vw)}to{transform:translateX(-160px)}}
.hills{position:absolute;bottom:0;left:0;width:100%;height:150px}
.flyer{position:absolute;font-size:34px;animation:flyx 24s linear infinite}
@keyframes flyx{from{transform:translateX(-80px) translateY(0)}50%{transform:translateX(50vw) translateY(-30px)}to{transform:translateX(110vw) translateY(0)}}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- top bar ---------- */
#hud{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:7px;padding:calc(env(safe-area-inset-top,0px) + 8px) 10px 8px}
.hb{width:46px;height:46px;flex:none;border-radius:50%;background:#fff;font-size:22px;display:grid;place-items:center;box-shadow:0 4px 0 #c9b8f5;border:3px solid #fff;transition:transform .12s}
.hb:active{transform:translateY(3px);box-shadow:0 1px 0 #c9b8f5}
#backBtn{background:var(--sun);box-shadow:0 4px 0 #d9a400;font-size:26px}
.hb.on{background:var(--red);box-shadow:0 4px 0 #c43c3c;animation:pulse 1s infinite}
.me{flex:1;min-width:0;display:flex;align-items:center;gap:8px;background:#fff;border-radius:24px;padding:4px 10px 4px 5px;box-shadow:0 4px 0 #c9b8f5}
.av{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:linear-gradient(135deg,#ffe08a,#ffb347);flex:none}
.me b{font-size:16px;display:block;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.xp{height:9px;border-radius:9px;background:#efe8ff;overflow:hidden;margin-top:3px}
.xp i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--grn),#9be15d);border-radius:9px;transition:width .6s}
.pill{display:flex;align-items:center;gap:3px;padding:0 10px;height:46px;border-radius:24px;background:#fff;box-shadow:0 4px 0 #c9b8f5;font-size:18px;white-space:nowrap;flex:none}
@media(max-width:480px){#hud{gap:5px;padding-left:6px;padding-right:6px}.hb{width:40px;height:40px;font-size:19px}.pill{height:40px;padding:0 7px;font-size:15px}.av{width:30px;height:30px;font-size:19px}.me b{font-size:14px}}
#recbar{position:sticky;top:64px;z-index:29;margin:0 12px 6px;padding:10px 14px;border-radius:20px;background:var(--red);color:#fff;display:flex;gap:10px;align-items:center;font-size:15px;border:3px solid #fff;box-shadow:0 5px 0 #c43c3c}
#recbar button{background:#fff;color:#c43c3c;border-radius:14px;padding:4px 12px;margin-inline-start:auto}

/* ---------- bottom nav ---------- */
#nav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;justify-content:space-around;padding:6px 6px calc(env(safe-area-inset-bottom,0px) + 6px);background:#fff;border-radius:26px 26px 0 0;box-shadow:0 -4px 0 #e7defc,0 -8px 24px #3b2a6322}
#nav button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:13px;color:var(--mut);padding:4px 0;transition:transform .15s}
#nav button span{font-size:28px;width:52px;height:44px;display:grid;place-items:center;border-radius:18px;transition:all .2s}
#nav button.on{color:var(--ink)}
#nav button.on span{background:var(--c);transform:translateY(-10px) scale(1.12);box-shadow:0 5px 0 var(--d);border:3px solid #fff}
#nav button:active{transform:scale(.9)}

#view{position:relative;z-index:1;max-width:760px;margin:0 auto;padding:4px 14px 120px}
#view.enter{animation:enter .45s cubic-bezier(.2,.9,.3,1.3)}
@keyframes enter{from{opacity:0;transform:translateY(30px) scale(.95)}}

/* ---------- basic pieces ---------- */
.card{background:#fff;border-radius:28px;box-shadow:0 6px 0 #d9ccfa,0 10px 24px #3b2a6314;border:3px solid #fff}
h2.t{font-size:28px;margin:6px 0 12px;text-align:center;color:#fff;text-shadow:0 3px 0 var(--pur),0 0 12px #9b5de588;-webkit-text-stroke:1px var(--pur)}
.sub{color:var(--mut);text-align:center;font-size:15px;margin:-6px 0 14px}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:12px 0}
.btn{--c:var(--pur);--d:#6b38b8;display:inline-flex;align-items:center;gap:8px;justify-content:center;padding:12px 20px;border-radius:24px;font-size:18px;font-weight:800;color:#fff;background:var(--c);border:3px solid #fff;box-shadow:0 6px 0 var(--d),0 9px 16px #0002;text-shadow:0 2px 0 var(--d);transition:transform .1s,box-shadow .1s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--d)}
.btn.sm{padding:8px 14px;font-size:15px;border-radius:18px}
.b-r{--c:#ff6b6b;--d:#c94343}.b-g{--c:#3ec46d;--d:#25904c}.b-b{--c:#4d96ff;--d:#2a66c4}.b-y{--c:#ffb703;--d:#c98a00}.b-p{--c:#f15bb5;--d:#b83586}.b-o{--c:#ff9f1c;--d:#c77400}.b-t{--c:#1fc7c1;--d:#14918c}.b-w{--c:#fff;--d:#d9ccfa;color:var(--ink);text-shadow:none}
@keyframes pulse{50%{transform:scale(1.08)}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg) scale(1.05)}75%{transform:rotate(8deg) scale(1.05)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes squish{0%{transform:scale(1)}30%{transform:scale(1.25,.8)}60%{transform:scale(.9,1.15)}100%{transform:scale(1)}}
@keyframes popIn{from{opacity:0;transform:scale(.4) rotate(-10deg)}}
@keyframes shake{20%,60%{transform:translateX(-10px)}40%,80%{transform:translateX(10px)}}
.sq{animation:squish .45s}

/* ---------- owl ---------- */
.owl{width:110px;height:120px;flex:none;overflow:visible;animation:bounce 2.6s ease-in-out infinite;filter:drop-shadow(0 6px 0 #0001);cursor:pointer}
.owl .eye{transform-box:fill-box;transform-origin:center;animation:blink 4.2s infinite}
.owl .pup{transform:translate(var(--px,0px),var(--py,0px));transition:transform .15s}
.owl .bk2{transform-box:fill-box;transform-origin:top}
.owl .wl,.owl .wr{transform-box:fill-box}
.owl .wl{transform-origin:right top}.owl .wr{transform-origin:left top}
body.talking .owl .bk2{animation:beak .17s infinite alternate}
body.talking .owl .wl{animation:flapL .3s infinite alternate}
body.talking .owl .wr{animation:flapR .3s infinite alternate}
.owl.tick{animation:wob .6s}
@keyframes beak{to{transform:translateY(5px) scaleY(1.5)}}
@keyframes flapL{to{transform:rotate(18deg)}}@keyframes flapR{to{transform:rotate(-18deg)}}
@keyframes blink{0%,45%,49%,100%{transform:scaleY(1)}47%{transform:scaleY(.08)}}
.bot{display:flex;align-items:center;gap:8px;margin:2px 0 14px}
.speech{position:relative;flex:1;background:#fff;border-radius:26px;padding:14px 18px;font-size:19px;line-height:1.5;min-height:58px;box-shadow:0 5px 0 #d9ccfa;border:3px solid #fff}
.speech:after{content:'';position:absolute;top:24px;right:-14px;border:10px solid transparent;border-left:16px solid #fff;border-right:0}

/* ---------- splash ---------- */
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px;background:linear-gradient(180deg,#6cc8ff,#bfeaff 60%,#bff0b8)}
#splash h1{font-size:clamp(42px,11vw,72px);margin:0;line-height:1.1;color:#fff;-webkit-text-stroke:2px var(--pur);text-shadow:0 5px 0 var(--pur),0 9px 0 #0002}
#splash p{margin:0;color:var(--ink);font-size:18px;background:#fff9;padding:4px 14px;border-radius:14px}
#splash .owl{width:190px;height:205px}
.startbtn{font-size:28px;padding:16px 44px;border-radius:34px;animation:pulse 1.4s infinite}
.balloons{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.balloons span{position:absolute;bottom:-90px;font-size:50px;animation:rise2 linear infinite}
@keyframes rise2{to{transform:translateY(-120vh) rotate(15deg)}}

/* ---------- home map ---------- */
.topcards{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:8px}
.mini{padding:10px 12px;font-size:14px}
.mini h4{margin:0 0 6px;font-size:16px;display:flex;align-items:center;gap:6px}
.mrow{display:flex;align-items:center;gap:6px;margin:4px 0;font-size:13px}
.mrow span{flex:none;width:26px;text-align:center;font-size:18px}
.bar{flex:1;height:13px;border-radius:9px;background:#efe8ff;overflow:hidden;border:2px solid #fff;box-shadow:inset 0 2px 0 #0001}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--org),var(--sun));border-radius:9px;transition:width .6s}
.mrow.ok .bar i{background:linear-gradient(90deg,var(--grn),#9be15d)}
.giftc{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:2px}
.giftc .e{font-size:44px;animation:wob 2.4s infinite}
.map{position:relative;margin:6px auto 0;max-width:520px}
.map svg.path{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.node{position:absolute;width:118px;transform:translate(-50%,0);display:flex;flex-direction:column;align-items:center;gap:2px;animation:popIn .5s backwards}
.node .ball{width:104px;height:104px;border-radius:50%;display:grid;place-items:center;font-size:54px;background:radial-gradient(circle at 32% 28%,#fff9 0 12%,transparent 13%),var(--c);border:5px solid #fff;box-shadow:0 8px 0 var(--d),0 14px 20px #0002;animation:bounce 2.8s ease-in-out infinite}
.node:nth-child(odd) .ball{animation-delay:-1.3s}
.node .lbl{background:#fff;border-radius:16px;padding:3px 12px;font-size:16px;box-shadow:0 4px 0 #d9ccfa;white-space:nowrap;margin-top:4px}
.node .ball.wob{animation:wob .7s}
.node:active .ball{transform:scale(.88)}
.deco{position:absolute;font-size:30px;pointer-events:none}
.todaychip{display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:10px;font-size:16px}
.todaychip .btn{margin-inline-start:auto}

/* chips */
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px}
.chip{--c:#4d96ff;--d:#2a66c4;padding:14px 8px;border-radius:26px;font-size:18px;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--c);color:#fff;text-shadow:0 2px 0 var(--d);border:4px solid #fff;box-shadow:0 7px 0 var(--d);animation:popIn .45s backwards;transition:transform .1s}
.chip .e{font-size:44px;filter:drop-shadow(0 3px 0 #0002);animation:bounce 2.5s ease-in-out infinite}
.chip:active{transform:translateY(5px);box-shadow:0 2px 0 var(--d)}
.chip.sel{outline:5px solid var(--sun)}


/* onboarding */
.gender{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:10px 0}
.gender button{padding:20px 8px;font-size:24px}
.gender .e{font-size:84px!important}
.names{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:9px;margin-top:10px}
.names button{padding:12px 4px;border-radius:20px;font-size:18px;background:#fff;box-shadow:0 5px 0 #d9ccfa;border:3px solid #fff;animation:popIn .35s backwards}
.names button.sel{background:var(--sun);box-shadow:0 5px 0 #c98a00}
.field{display:flex;flex-direction:column;gap:6px;text-align:start;margin:12px 0;font-size:16px}
.field input[type=text]{padding:13px 16px;border-radius:18px;border:3px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:19px}
.field input[type=range]{width:100%;accent-color:var(--pur)}

/* book */
.chap{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.chap button{border-radius:24px;overflow:hidden;background:#fff;box-shadow:0 6px 0 #d9ccfa;border:4px solid #fff;padding:0 0 8px;animation:popIn .45s backwards;transition:transform .1s}
.chap button:active{transform:translateY(4px)}
.chap img{width:100%;height:120px;object-fit:cover;object-position:top;display:block;margin-bottom:6px;border-radius:18px 18px 0 0}
.chap b{font-size:16px;display:block;padding:0 6px}.chap small{color:var(--mut);font-size:12px}
.pghead{display:flex;align-items:center;gap:10px;margin-bottom:10px;padding:8px 14px}
.pghead b{font-size:19px;flex:1}
.pgnum{font-size:14px;padding:4px 12px;border-radius:12px;background:#f2ecff}
.pgwrap{position:relative;border-radius:24px;overflow:auto;border:5px solid #fff;box-shadow:0 7px 0 #d9ccfa}
.pg{position:relative;width:100%;background:#fff;transition:width .3s}
.pg.zoom{width:170%}
.pg img{display:block;width:100%;pointer-events:none}
.hs{position:absolute;border-radius:16px;cursor:pointer}
.hs:after{content:'👆';position:absolute;left:50%;top:50%;font-size:22px;margin:-14px;animation:tapme 1.6s infinite}
.hs.f:after{content:'⭐';animation:none;font-size:18px}
.hs.on{background:#ffd23f66;outline:5px solid var(--sun)}
.hs.ok{background:#3ec46d55;outline:5px solid var(--ok)}
.hs.no{animation:shake .4s}
@keyframes tapme{0%,100%{transform:translateY(0) scale(1)}50%{transform:translateY(-6px) scale(1.15)}}
.wlabel{position:absolute;transform:translate(-50%,-100%);background:var(--pnk);color:#fff;border:3px solid #fff;padding:4px 14px;border-radius:18px;font-size:22px;white-space:nowrap;pointer-events:none;animation:lbl 1.6s forwards;z-index:3;box-shadow:0 4px 0 #b83586}
@keyframes lbl{0%{opacity:0;transform:translate(-50%,-60%) scale(.5)}15%{opacity:1;transform:translate(-50%,-110%) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-150%)}}
.found{display:flex;align-items:center;gap:10px;margin:10px 0;font-size:15px;padding:10px 14px}
.lines{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:12px 0}
.ln{padding:10px 16px;border-radius:20px;background:#fff;box-shadow:0 5px 0 #d9ccfa;font-size:21px;transition:all .2s;border:3px solid #fff}
.ln.on{background:var(--sun);box-shadow:0 5px 0 #c98a00;transform:scale(1.06)}
.ctrl{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;padding:12px;margin-top:10px}

/* letters */
.lgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:11px}
.lt{--c:#4d96ff;--d:#2a66c4;position:relative;aspect-ratio:1;border-radius:24px;font-size:46px;line-height:1;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--c);color:#fff;text-shadow:0 3px 0 var(--d);border:4px solid #fff;box-shadow:0 6px 0 var(--d);animation:popIn .4s backwards;transition:transform .1s}
.lt:active{transform:translateY(4px);box-shadow:0 2px 0 var(--d)}
.lt small{font-size:11px;margin-top:3px;text-shadow:none;opacity:.95}
.lt .dots{position:absolute;bottom:5px;display:flex;gap:3px}
.lt .dots i{width:7px;height:7px;border-radius:50%;background:#ffffff66}.lt .dots i.y{background:var(--sun);box-shadow:0 0 0 1px #fff}
.lt .crown{position:absolute;top:-14px;left:-6px;font-size:24px;text-shadow:none;animation:wob 2s infinite}
.bigL{position:relative;width:180px;height:180px;margin:4px auto 6px;display:grid;place-items:center;font-size:120px;line-height:1;border-radius:50%;background:var(--sun);color:#fff;border:7px solid #fff;box-shadow:0 9px 0 #c98a00,0 14px 30px #0002;text-shadow:0 5px 0 #c98a00;cursor:pointer}
.bigL span{animation:bounce 2.4s ease-in-out infinite}
.har{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:10px 0}
.har button{min-width:64px;height:64px;border-radius:50%;font-size:32px;background:#fff;border:4px solid #fff;box-shadow:0 5px 0 #d9ccfa;animation:bounce 2.4s ease-in-out infinite}
.har button:nth-child(2n){animation-delay:-.6s}.har button:nth-child(3n){animation-delay:-1.2s}
.forms{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}
@media(min-width:620px){.forms{grid-template-columns:repeat(4,1fr)}}
.fcard{--c:#4d96ff;--d:#2a66c4;padding:12px 8px;border-radius:24px;display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--c);color:#fff;border:4px solid #fff;box-shadow:0 7px 0 var(--d);animation:popIn .45s backwards;transition:transform .1s;text-shadow:0 2px 0 var(--d)}
.fcard:active{transform:translateY(4px)}
.fcard small{font-size:14px;background:#fff;color:var(--ink);padding:1px 12px;border-radius:12px;text-shadow:none}
.fcard .g{font-size:60px;line-height:1.3}
.fcard .w{font-size:22px;display:flex;align-items:center;gap:6px;background:#ffffff33;border-radius:14px;padding:0 10px}
.hl{color:var(--red)}
.fcard .hl{color:#fff200;text-shadow:0 2px 0 #0006}
.tip{padding:10px 14px;border-radius:18px;background:#fff6cf;border:3px dashed var(--sun);font-size:15px;margin:10px 0;text-align:center}

/* tracing */
.steps{display:flex;gap:6px;justify-content:center;margin:6px 0 10px;flex-wrap:wrap}
.steps span{padding:6px 12px;border-radius:16px;font-size:14px;background:#fff;box-shadow:0 4px 0 #d9ccfa}
.steps span.cur{background:var(--pnk);color:#fff;box-shadow:0 4px 0 #b83586}
.steps span.ok{background:#d8f8e1}
.example{display:flex;align-items:center;justify-content:center;gap:12px;font-size:34px;padding:6px 16px;margin:0 auto 10px;width:fit-content}
.example .em{font-size:46px}
.board{position:relative;width:min(100%,460px);margin:0 auto;aspect-ratio:6/5;border-radius:30px;overflow:hidden;background:#2f6b3f;border:10px solid #c98a4b;box-shadow:0 8px 0 #8a5a2b,0 14px 26px #0003,inset 0 0 40px #0005;touch-action:none}
.board:before{content:'';position:absolute;inset:0;background-image:linear-gradient(#ffffff10 1px,transparent 1px),linear-gradient(90deg,#ffffff10 1px,transparent 1px);background-size:34px 34px}
.board canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.board canvas:last-child{pointer-events:none}
.meter{width:min(100%,460px);margin:12px auto 0;display:flex;align-items:center;gap:10px;font-size:15px}
.meter .bar i{background:linear-gradient(90deg,var(--pnk),var(--sun),var(--grn))}
.board.win{animation:squish .7s}

/* games */
.gcards{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:620px){.gcards{grid-template-columns:repeat(3,1fr)}}
.gcard{--c:#4d96ff;--d:#2a66c4;position:relative;border-radius:26px;padding:14px 8px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;background:var(--c);color:#fff;text-shadow:0 2px 0 var(--d);border:4px solid #fff;box-shadow:0 7px 0 var(--d);animation:popIn .45s backwards;transition:transform .1s}
.gcard:active{transform:translateY(5px);box-shadow:0 2px 0 var(--d)}
.gcard .e{font-size:50px;animation:bounce 2.6s ease-in-out infinite;filter:drop-shadow(0 3px 0 #0002)}
.gcard:nth-child(2n) .e{animation-delay:-1s}
.gcard b{font-size:17px}
.gcard .st{font-size:14px;letter-spacing:1px;background:#fff;border-radius:12px;padding:0 8px;text-shadow:none}
.ghead{display:flex;align-items:center;gap:8px;margin-bottom:10px}
.ghead .prog{flex:1;display:flex;gap:4px;background:#fff;padding:6px;border-radius:16px;box-shadow:0 4px 0 #d9ccfa}
.ghead .prog i{flex:1;height:14px;border-radius:8px;background:#efe8ff;transition:background .3s}
.ghead .prog i.d{background:var(--grn)}
.ghead .prog i.c{background:var(--sun);animation:pulse 1s infinite}
.combo{font-size:17px;min-width:52px;text-align:center;background:#fff;border-radius:16px;padding:6px 8px;box-shadow:0 4px 0 #d9ccfa}
.combo.hot{animation:pulse .6s infinite;background:var(--org);color:#fff}
.qbox{padding:14px;text-align:center;margin-bottom:12px}

.neon{font-size:96px;color:var(--pnk);text-shadow:0 5px 0 #b8358655}
.gap{display:inline-block;min-width:1.1em;height:1.05em;vertical-align:middle;border:4px dashed var(--org);background:#fff3d6;border-radius:14px;animation:pulse 1.2s infinite;margin:0 2px}
.opts{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.opts.c3{grid-template-columns:repeat(3,1fr)}
.opt{min-height:100px;border-radius:26px;font-size:34px;background:#fff;border:4px solid #fff;box-shadow:0 7px 0 #d9ccfa;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:transform .1s;animation:popIn .4s backwards;padding:6px}
.opt:nth-child(4n+1){box-shadow:0 7px 0 #ffc2c2}.opt:nth-child(4n+2){box-shadow:0 7px 0 #c2dcff}.opt:nth-child(4n+3){box-shadow:0 7px 0 #c6f1d3}.opt:nth-child(4n){box-shadow:0 7px 0 #f8d38f}
.opt.big{font-size:60px}
.opt:active{transform:translateY(5px)}

.slots{display:flex;gap:8px;justify-content:center;margin:10px 0;flex-wrap:wrap;min-height:84px}

.tile:nth-child(3n){background:var(--blu);box-shadow:0 6px 0 #2a66c4;text-shadow:0 2px 0 #2a66c4}
.tile.used{visibility:hidden}
.word-done{font-size:56px;text-align:center;color:var(--grn);animation:squish .6s}
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;perspective:800px}
@media(min-width:620px){.mem{grid-template-columns:repeat(4,1fr)}}
.mc{aspect-ratio:1;position:relative;transform-style:preserve-3d;transition:transform .45s;animation:popIn .4s backwards}
.mc.up,.mc.m{transform:rotateY(180deg)}
.mc>div{position:absolute;inset:0;border-radius:22px;display:grid;place-items:center;backface-visibility:hidden;-webkit-backface-visibility:hidden;border:4px solid #fff}

.mc.m .fr{background:#d8f8e1;box-shadow:0 6px 0 #25904c}
.arena{position:relative;height:60vh;min-height:340px;border-radius:30px;overflow:hidden;background:linear-gradient(#bfeaff,#e3f7ff);border:5px solid #fff;box-shadow:0 7px 0 #d9ccfa}
.bub{position:absolute;bottom:-110px;width:86px;height:86px;border-radius:50%;display:grid;place-items:center;font-size:42px;color:#fff;text-shadow:0 2px 0 #0003;background:radial-gradient(circle at 30% 28%,#fff 0 10%,transparent 11%),var(--bc);border:4px solid #fff;box-shadow:0 5px 0 #0002;animation:rise var(--d) linear forwards}
@keyframes rise{to{transform:translateY(calc(-60vh - 240px)) translateX(var(--sx))}}
.bub.pop{animation:popb .3s forwards}
@keyframes popb{to{transform:scale(1.8);opacity:0}}
.timer{height:16px;border-radius:12px;background:#fff;overflow:hidden;margin-bottom:10px;border:3px solid #fff;box-shadow:0 4px 0 #d9ccfa}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--red),var(--sun),var(--grn));transition:width 1s linear;border-radius:9px}

/* studio & sheets */
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 2px 10px;margin-bottom:6px;scrollbar-width:none}

.srch{width:100%;padding:12px 16px;border-radius:18px;border:3px solid #fff;background:#fff;color:var(--ink);font:inherit;font-size:16px;margin-bottom:10px;box-shadow:0 4px 0 #d9ccfa}

.vrow span{flex:1}
.vrow .d{width:12px;height:12px;border-radius:50%;background:#e2daf7;flex:none}.vrow .d.y{background:var(--grn)}.vrow .d.g{background:var(--blu)}
.vrow button{width:42px;height:42px;border-radius:14px;background:#f4efff;font-size:18px}
.shade{position:fixed;inset:0;z-index:80;background:#3b2a6366;display:flex;align-items:flex-end;justify-content:center;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:min(100%,580px);max-height:92vh;overflow:auto;padding:20px 16px calc(24px + env(safe-area-inset-bottom,0px));border-radius:32px 32px 0 0;background:#fff;animation:up .35s cubic-bezier(.2,.9,.3,1.2);text-align:center;border-top:6px solid var(--sun)}
@keyframes up{from{transform:translateY(100%)}}

.rtext{font-size:30px;padding:12px;margin:10px 0;border-radius:20px;background:#f4efff}
.mic{width:120px;height:120px;border-radius:50%;font-size:52px;background:var(--red);border:6px solid #fff;box-shadow:0 8px 0 #c94343,0 0 0 8px #ff6b6b33;margin:10px auto;display:grid;place-items:center}
.mic.on{animation:pulse .8s infinite;background:#ff3b3b}
.rstat{min-height:26px;color:var(--mut);font-size:15px}
.gifts{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.gifts button{padding:10px 4px;border-radius:22px;background:#fff;box-shadow:0 5px 0 #d9ccfa;border:3px solid #f2ecff;font-size:15px;display:flex;flex-direction:column;align-items:center;animation:popIn .35s backwards}
.gifts .e{font-size:46px;animation:bounce 2.2s ease-in-out infinite}
.gifts button:nth-child(2n) .e{animation-delay:-.8s}
/* fx */
.fx{position:fixed;pointer-events:none;z-index:90;font-size:26px;animation:burst 1s cubic-bezier(.1,.8,.3,1) forwards}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) rotate(var(--rt)) scale(.4);opacity:0}}
.ftxt{position:fixed;z-index:91;pointer-events:none;font-size:26px;font-weight:800;color:#fff;-webkit-text-stroke:1px var(--org);text-shadow:0 3px 0 var(--org);animation:ftxt 1.2s forwards;transform:translate(-50%,-50%)}
@keyframes ftxt{to{transform:translate(-50%,-160%);opacity:0}}
.toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 70px);left:50%;transform:translateX(-50%);z-index:95;padding:12px 20px;border-radius:24px;background:#fff;border:4px solid var(--sun);font-size:17px;box-shadow:0 6px 0 #c98a00;animation:toast 3.2s forwards;display:flex;align-items:center;gap:10px;max-width:92vw}
.toast .e{font-size:36px}
@keyframes toast{0%{opacity:0;transform:translate(-50%,-30px) scale(.8)}10%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-20px)}}
.lvlup{position:fixed;inset:0;z-index:96;display:grid;place-items:center;background:#3b2a6355;animation:fade .3s}
.lvlup div{text-align:center;padding:26px 30px;border-radius:34px;background:#fff;border:6px solid var(--sun);box-shadow:0 10px 0 #c98a00;animation:squish .7s}
.lvlup b{font-size:44px;display:block;color:var(--pur)}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.badge{padding:12px 8px;border-radius:24px;text-align:center;background:#fff;box-shadow:0 5px 0 #d9ccfa;animation:popIn .4s backwards}
.badge .e{font-size:46px}.badge b{display:block;font-size:15px}.badge small{color:var(--mut);font-size:12px}
.badge.lock{filter:grayscale(1);opacity:.5}
.badge:not(.lock){box-shadow:0 5px 0 #c98a00;border:3px solid var(--sun)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.stats div{padding:12px 6px;text-align:center;border-radius:20px;background:#fff;box-shadow:0 5px 0 #d9ccfa}
.stats b{display:block;font-size:26px;color:var(--org)}.stats small{font-size:13px;color:var(--mut)}
.poem .ln{display:block;width:100%;margin:9px 0;font-size:26px;text-align:center}
.cl0{--c:#ff6b6b;--d:#c94343}.cl1{--c:#ffb703;--d:#c98a00}.cl2{--c:#3ec46d;--d:#25904c}.cl3{--c:#4d96ff;--d:#2a66c4}.cl4{--c:#9b5de5;--d:#6b38b8}.cl5{--c:#f15bb5;--d:#b83586}.cl6{--c:#1fc7c1;--d:#14918c}.cl7{--c:#ff9f1c;--d:#c77400}
.gcard .st{color:#c98a00}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important}}
</style>
</head>

<script>
const IMG=/*IMG*/[];
/* ================= helpers ================= */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const rnd=n=>Math.random()*n|0,pickOne=a=>a[rnd(a.length)];
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const todayStr=(o=0)=>{const d=new Date(Date.now()+o*864e5);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function hsh(s){let h=0x811c9dc5;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,0x01000193)>>>0}return('0000000'+h.toString(16)).slice(-8)}

/* ================= state ================= */
const DEF={ob:0,name:'',g:'m',stars:0,xp:0,streak:0,last:'',L:{},pages:{},found:{},games:{},played:0,perfect:0,popped:0,badges:[],day:{d:'',g:0,w:0,p:0,done:0},sfx:1,rate:.95,today:null,voices:0,nums:{},wish:null,wishes:[]};
let S;
function load(){let raw=null;try{raw=localStorage.getItem('mq3')}catch(e){}
  try{S=Object.assign(JSON.parse(JSON.stringify(DEF)),raw?JSON.parse(raw):{})}catch(e){S=JSON.parse(JSON.stringify(DEF))}}
function save(){try{localStorage.setItem('mq3',JSON.stringify(S))}catch(e){}hud()}
const G2=(m,f)=>S.g==='f'?f:m;
const lvl=()=>Math.floor(S.xp/100)+1;
function hud(){$('#hName').textContent=(S.name||'')+' · مستوى '+lvl();$('#hAv').textContent=G2('👦','👧');$('#hStars').textContent=S.stars;$('#hXp').style.width=(S.xp%100)+'%';const w=wishToday();$('#hGift').textContent=w?w[0]:'🎁'}
function addXP(n,el){const before=lvl();S.xp+=n;if(el)floatTxt(el,'+'+n);save();if(lvl()>before)levelUp()}
function addStars(n,el){S.stars+=n;if(el)flyStar(el);save();checkBadges()}
function ensureDay(){if(S.day.d!==todayStr())S.day={d:todayStr(),g:0,w:0,p:0,done:0}}
const MIS=[['g',3,'🎮'],['w',4,'✏️'],['p',3,'📖']];
function progress(k){ensureDay();S.day[k]++;save();if(!S.day.done&&MIS.every(m=>S.day[m[0]]>=m[1])){S.day.done=1;save();setTimeout(()=>{SFX.lvl();confetti(innerWidth/2,innerHeight/2,40);toast('🎁','خلّصت كل مهمات اليوم!');addXP(50);say(G2('عفية! خلصت كل مهمات اليوم','عفية! خلصتي كل مهمات اليوم'))},900)}}

/* ================= sound fx ================= */
let AC;function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d=.12,type='sine',v=.15,when=0,slide=0){const a=ac();if(!a||!S.sfx)return;const t=a.currentTime+when,o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+.03)}
const SFX={tap:()=>tone(620,.08,'sine',.12,0,940),pop:()=>{tone(320,.12,'sine',.22,0,1300);tone(1600,.05,'triangle',.05,.05)},
 ok:()=>[659,784,988,1319].forEach((f,i)=>tone(f,.2,'triangle',.14,i*.08)),bad:()=>{tone(330,.18,'sine',.12,0,220);tone(250,.25,'sine',.1,.13,180)},
 lvl:()=>[523,659,784,1047,784,1047,1319].forEach((f,i)=>tone(f,.22,'triangle',.12,i*.1)),whoosh:()=>tone(240,.35,'sine',.1,0,900),
 star:()=>{tone(1250,.1,'triangle',.1);tone(1660,.16,'triangle',.1,.07)},flip:()=>tone(520,.08,'sine',.1,0,860),boing:()=>tone(180,.3,'sine',.18,0,520)};
let lastTap=0;
document.addEventListener('pointerdown',e=>{lastTap=Date.now();if(e.target.closest('button'))SFX.tap()},true);
document.addEventListener('pointermove',e=>{const x=(e.clientX/innerWidth-.5)*10,y=(e.clientY/innerHeight-.5)*8;document.documentElement.style.setProperty('--px',x.toFixed(1)+'px');document.documentElement.style.setProperty('--py',y.toFixed(1)+'px')},{passive:true});

/* ================= voice ================= */
const VSET=new Set((window.VOICES||'').split(',').filter(Boolean));
let voice=null,KEEP=null,tok=0,REC=0,talkN=0,curAud=null,curRes=null,ttsId=0;const ttsWait={};
window.__ttsDone=id=>{const r=ttsWait[id];if(r){delete ttsWait[id];r()}};
function pickV(){if(!window.speechSynthesis)return;const a=speechSynthesis.getVoices().filter(v=>/^ar/i.test(v.lang));voice=a.find(v=>/IQ/i.test(v.lang))||a.find(v=>/female|laila|zariyah|hoda|salma|sara|amina|fatima|rana|google/i.test(v.name))||a[0]||null}
if(window.speechSynthesis){pickV();speechSynthesis.onvoiceschanged=pickV}
function netTTS(t,r){if(!navigator.onLine)return r();try{const a=new Audio('https://translate.google.com/translate_tts?ie=UTF-8&client=tw-ob&tl=ar&q='+encodeURIComponent(t));curAud=a;curRes=r;a.onended=r;a.onerror=r;a.play().catch(r)}catch(e){r()}}
function tts(t){return new Promise(res=>{let done=0;const r=()=>{if(!done){done=1;clearTimeout(w);res()}};let w=setTimeout(r,Math.max(3500,t.length*420));
  if(window.AndroidTTS&&AndroidTTS.ok&&AndroidTTS.ok()){const id='t'+(++ttsId);ttsWait[id]=r;curRes=r;try{AndroidTTS.speak(id,t,S.rate)}catch(e){r()}return}
  const ss=window.speechSynthesis;if(!ss||!voice){netTTS(t,r);return}
  try{ss.cancel();ss.resume()}catch(e){}
  setTimeout(()=>{const u=new SpeechSynthesisUtterance(t);KEEP=u;u.lang=voice.lang;u.voice=voice;u.rate=S.rate*.9;u.pitch=1.15;u.onend=r;u.onerror=e=>{if(e&&(e.error==='interrupted'||e.error==='canceled'))r();else netTTS(t,r)};try{ss.speak(u)}catch(e){netTTS(t,r)}},60)})}
let DB;const idb=()=>DB||(DB=new Promise((res,rej)=>{try{const q=indexedDB.open('aud',1);q.onupgradeneeded=()=>q.result.createObjectStore('a');q.onsuccess=()=>res(q.result);q.onerror=()=>rej()}catch(e){rej()}}));
async function aget(k){try{const d=await idb();return await new Promise(r=>{const q=d.transaction('a').objectStore('a').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r()})}catch(e){}}
async function aset(k,b){try{const d=await idb();await new Promise(r=>{const tx=d.transaction('a','readwrite');tx.objectStore('a').put(b,k);tx.oncomplete=r;tx.onerror=r});RC.add(k)}catch(e){}}
async function adel(k){try{const d=await idb();await new Promise(r=>{const tx=d.transaction('a','readwrite');tx.objectStore('a').delete(k);tx.oncomplete=r;tx.onerror=r});RC.delete(k)}catch(e){}}
const RC=new Set();
async function loadKeys(){try{const d=await idb();await new Promise(r=>{const q=d.transaction('a').objectStore('a').getAllKeys();q.onsuccess=()=>{q.result.forEach(k=>RC.add(k));r()};q.onerror=r})}catch(e){}}
function playSrc(src,isBlob){return new Promise(r=>{try{const a=new Audio(src);curAud=a;curRes=r;a.playbackRate=S.rate<.85?.9:1;a.onended=()=>{if(isBlob)URL.revokeObjectURL(src);r()};a.onerror=()=>r('err');a.play().catch(()=>r('err'))}catch(e){r('err')}})}
const has=k=>RC.has(k)||VSET.has(hsh(k));

    try{const a=ac(),src=a.createMediaStreamSource(stream),an=a.createAnalyser();an.fftSize=256;src.connect(an);const buf=new Uint8Array(an.frequencyBinCount),cv=$('#viz',sh),x=cv.getContext('2d');
      (function dr(){an.getByteFrequencyData(buf);x.clearRect(0,0,300,50);for(let i=0;i<60;i++){const h=buf[i*2]/255*48;x.fillStyle=`hsl(${i*6},90%,60%)`;x.fillRect(i*5,25-h/2,3,h||2)}raf=requestAnimationFrame(dr)})()}catch(e){}};
  $('#pl',sh).onclick=()=>{stop();blob?playSrc(URL.createObjectURL(blob),1):say(key,false)};
  sv.onclick=async()=>{if(!blob)return;await aset(key,blob);S.voices++;save();checkBadges();SFX.ok();confetti(sv,0,16);toast('✅','انحفظ صوتك: '+key);close()};
  $('#dl',sh).onclick=async()=>{await adel(key);rs.textContent='🗑️ انحذف صوتك'};
  $('#fl',sh).onchange=e=>{const f=e.target.files[0];if(f){blob=f;sv.disabled=false;sv.style.opacity=1;rs.textContent='📂 تم اختيار الملف، اضغط احفظ';playSrc(URL.createObjectURL(f),1)}}}

/* ================= awards & settings ================= */
const BADGES=[['🌟','أول نجمة','اجمع أول نجمة',()=>S.stars>=1],['💫','جامع النجوم','اجمع ٥٠ نجمة',()=>S.stars>=50],['🌈','ملك النجوم','اجمع ٢٠٠ نجمة',()=>S.stars>=200],
 ['✏️','الكاتب الصغير','اكتب حرف بكل أشكاله',()=>LT.some(c=>S.L[c]&&S.L[c].f.every(Boolean))],['🖋️','الخطّاط','اكتب ١٠ حروف كاملة',()=>LT.filter(c=>S.L[c]&&S.L[c].f.every(Boolean)).length>=10],['👑','بطل الكتابة','اكتب كل الحروف',()=>LT.every(c=>S.L[c]&&S.L[c].f.every(Boolean))],
 ['📖','القارئ','اقرا ١٠ صفحات',()=>Object.keys(S.pages).length>=10],['📚','قارئ الكتاب','اقرا كل الصفحات',()=>Object.keys(S.pages).length>=IMG.length],
 ['🎮','اللاعب','العب ١٠ ألعاب',()=>S.played>=10],['🏆','بلا غلطة','خلّص لعبة بثلاث نجوم',()=>S.perfect>=1],['🎈','صياد الفقاعات','فقّع ٥٠ فقاعة',()=>S.popped>=50],
 ['🔥','ثلاث أيام','العب ٣ أيام ورا بعض',()=>S.streak>=3],['🎙️','صوتي الحلو','سجّل أول صوت',()=>S.voices>=1||RC.size>0],['🚀','المستوى ٥','وصل للمستوى ٥',()=>lvl()>=5]];
function checkBadges(){BADGES.forEach(b=>{if(!S.badges.includes(b[1])&&b[3]()){S.badges.push(b[1]);save();setTimeout(()=>{SFX.lvl();toast(b[0],'وسام جديد: '+b[1]);confetti(innerWidth/2,90,24)},600)}})}
SCR.awards=v=>{v.innerHTML=`<div class=card style="padding:16px;text-align:center"><div style="font-size:64px">${G2('👦','👧')}</div><h2 class=t style="margin:4px 0">${esc(S.name)}</h2><div>المستوى ${lvl()}</div><div class=xp style="height:14px;margin:10px auto;max-width:300px"><i style="width:${S.xp%100}%"></i></div><small style="color:var(--mut)">${100-S.xp%100} نقطة للمستوى الجاي</small></div>
  <div class=stats><div><b>${S.stars}</b><small>⭐ نجمة</small></div><div><b>${S.streak}</b><small>🔥 يوم</small></div><div><b>${S.played}</b><small>🎮 لعبة</small></div><div><b>${Object.keys(S.pages).length}</b><small>📖 صفحة</small></div><div><b>${LT.filter(c=>S.L[c]&&S.L[c].f.every(Boolean)).length}</b><small>✏️ حرف كامل</small></div><div><b>${S.badges.length}</b><small>🏅 وسام</small></div></div>
  ${S.wishes.length?`<div class=card style="padding:12px;margin-bottom:12px"><b>🎁 الهدايا اللي طلبها (للأهل):</b><div style="margin-top:6px;font-size:15px">${S.wishes.slice(0,7).map(x=>`<div>${GIFTS[x.i][0]} ${GIFTS[x.i][1]} · <small style="color:var(--mut)">${x.d}</small></div>`).join('')}</div></div>`:''}
  <h3 style="text-align:center">🏅 الأوسمة (${S.badges.length}/${BADGES.length})</h3><div class=badges>${BADGES.map((b,i)=>`<div class="badge ${S.badges.includes(b[1])?'':'lock'}" style="animation-delay:${i*.04}s"><div class=e>${b[0]}</div><b>${b[1]}</b><small>${b[2]}</small></div>`).join('')}</div>`;
  say(G2('هاي جوائزك','هاي جوائزج'))};
$('#setBtn').onclick=()=>{const sh=document.createElement('div');sh.className='shade';sh.innerHTML=`<div class=sheet><h3>⚙️ الإعدادات</h3>
  <div class=card style="padding:12px;margin:8px 0"><div style="font-size:15px;color:var(--mut)">اسم الطفل</div><div style="font-size:26px">${G2('👦','👧')} ${esc(S.name)}</div><div class=row><button class="btn sm b-p" id=chn>✏️ غيّر الاسم</button><button class="btn sm b-r" id=rcn>🎙️ سجّل الاسم بصوتك</button></div></div>
  <label class=field>سرعة الصوت: <b id=rv>${S.rate}</b><input type=range id=rt min=.6 max=1.2 step=.05 value=${S.rate}></label>
  <div class=row><button class="btn sm ${S.sfx?'b-g':'b-w'}" id=sf>${S.sfx?'🔔 المؤثرات شغالة':'🔕 المؤثرات طافية'}</button><button class="btn sm b-b" id=ts>🔊 جرّب الصوت</button></div>
  <div class=sub style="margin:6px 0">${VSET.size?`🔵 الأصوات الجاهزة: ${VSET.size}`:(window.AndroidTTS?'🗣️ صوت التلفون':voice?'🗣️ '+esc(voice.name):'⚠️ ماكو أصوات جاهزة ولا صوت عربي بالجهاز')}</div>
  <div class=row><button class="btn b-g" id=ok>✅ تمام</button><button class="btn sm b-w" id=rs>♻️ صفّر التقدّم</button></div></div>`;document.body.appendChild(sh);
  $('#rt',sh).oninput=e=>{S.rate=+e.target.value;$('#rv',sh).textContent=S.rate};
  $('#sf',sh).onclick=e=>{S.sfx=S.sfx?0:1;e.currentTarget.textContent=S.sfx?'🔔 المؤثرات شغالة':'🔕 المؤثرات طافية';e.currentTarget.className='btn sm '+(S.sfx?'b-g':'b-w')};
  $('#ts',sh).onclick=()=>say(GREET(),false);
  $('#chn',sh).onclick=()=>{save();sh.remove();go('onboard',{s:1,back:1})};
  $('#rcn',sh).onclick=()=>{sh.remove();openRec([S.name])};
  $('#rs',sh).onclick=()=>{if(confirm('أكيد تريد تصفّر النجوم والتقدّم؟ (الاسم والأصوات تبقى)')){const k={ob:S.ob,name:S.name,g:S.g};S=Object.assign(JSON.parse(JSON.stringify(DEF)),k);save();sh.remove();go('home')}};
  const close=()=>{save();sh.remove();if(cur&&cur[0]==='home')go('home',null,1)};
  $('#ok',sh).onclick=close;sh.onclick=e=>{if(e.target===sh)close()}};

/* ================= boot ================= */
load();
(function(){const t=todayStr();if(S.last!==t){S.streak=S.last===todayStr(-1)?S.streak+1:1;S.last=t}ensureDay();save()})();
loadKeys().then(checkBadges);hud();
</script>
</body>
</html>
