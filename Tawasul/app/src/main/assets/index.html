<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>تواصل</title>
<style>
@font-face{font-family:Plex;src:url(fonts/PlexArabic-Regular.ttf);font-weight:400}
@font-face{font-family:Plex;src:url(fonts/PlexArabic-Medium.ttf);font-weight:500}
@font-face{font-family:Plex;src:url(fonts/PlexArabic-SemiBold.ttf);font-weight:600}
@font-face{font-family:Plex;src:url(fonts/PlexArabic-Bold.ttf);font-weight:700 800}
@font-face{font-family:Alx;src:url(fonts/Alexandria.ttf);font-weight:100 900}
:root{
  /* the same identity as «مدير الشاشة»: obsidian layers, champagne for decisions, signal blue for focus */
  --ac:#D6B47A; --ac2:#F0DDB2; --ac3:#9C7A44; --sig:#6E9BFF; --warn:#E8A33D; --bad:#EF5B5B; --ok:#4CC38A;
  --bg:#0B0C10; --bg2:#0F1116; --panel:#12141A; --panel2:#1A1D26; --line:#23262F; --line2:#2A2E3A;
  --ink:#F3EEE4; --mute:#A3A5B1; --onac:#0B0C10; --mine:#2A2417;
  --fd:Alx,Plex,system-ui,sans-serif; --fb:Plex,system-ui,sans-serif; --ease:cubic-bezier(.2,.8,.2,1);
}
body.light{--bg:#F5F2EC;--bg2:#EFEBE3;--panel:#FFFFFF;--panel2:#FBF9F5;--line:#E2DCD0;--line2:#D6CFC1;--ink:#16171D;--mute:#5E5F69;--ac:#B8924F;--mine:#F3E8CF;--sig:#2F5FD9;--ok:#1E8A57;--bad:#C2322C}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:400 15px/1.6 var(--fb);overflow:hidden}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(70% 40% at 100% 0%,rgba(214,180,122,.10),transparent 70%),radial-gradient(60% 35% at 0% 100%,rgba(110,155,255,.07),transparent 70%)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
input,textarea{font:inherit;color:inherit}
.view{position:fixed;inset:0;display:none;flex-direction:column;padding-top:env(safe-area-inset-top)}
.view.on{display:flex;animation:in .32s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;padding:14px 16px 10px}
.top h1{margin:0;flex:1;font:700 24px/1.2 var(--fd)}
.top h1 small{display:block;font:500 12px var(--fb);color:var(--mute);margin-top:2px}
.ib{width:42px;height:42px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-size:19px;transition:transform .2s var(--ease)}
.ib:active{transform:scale(.9)}
.scroll{flex:1;overflow-y:auto;padding:4px 14px 110px;-webkit-overflow-scrolling:touch}
.me{margin:6px 0 12px;padding:16px;border-radius:20px;background:linear-gradient(135deg,rgba(214,180,122,.18),var(--panel) 70%);border:1px solid var(--line2)}
.me small{color:var(--mute);display:block}
.me .code{font:700 30px/1.3 var(--fd);letter-spacing:3px;direction:ltr;text-align:right;color:var(--ac2)}
.me .row2{display:flex;margin-top:8px}.me .row2 button{margin-left:8px}
.btn{padding:11px 18px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);font-weight:600;transition:transform .2s var(--ease)}
.btn:active{transform:scale(.96)}
.btn.pri{background:var(--ac);color:var(--onac);border-color:var(--ac)}
.ct{display:flex;align-items:center;padding:12px;margin-bottom:8px;border-radius:18px;background:var(--panel);border:1px solid var(--line);transition:transform .2s var(--ease),background .2s;animation:in .35s var(--ease) both}
.ct:active{transform:scale(.985);background:var(--panel2)}
.av{width:48px;height:48px;border-radius:16px;flex:none;display:grid;place-items:center;font:700 20px var(--fd);color:var(--onac);margin-left:12px}
.ct .tx{flex:1;min-width:0}.ct b{display:block;font-weight:600}.ct small{display:block;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.badge{min-width:22px;height:22px;padding:0 6px;border-radius:11px;background:var(--ac);color:var(--onac);font:700 12px/22px var(--fb);text-align:center}
.empty{text-align:center;color:var(--mute);padding:50px 24px;line-height:1.9}
.fab{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:20px;height:54px;padding:0 22px;border-radius:27px;background:var(--ac);color:var(--onac);font-weight:700;box-shadow:0 10px 30px rgba(214,180,122,.35);transition:transform .2s var(--ease)}
.fab:active{transform:scale(.94)}
#msgs{flex:1;overflow-y:auto;padding:8px 14px 12px}
.m{max-width:82%;margin:4px 0;padding:9px 13px;border-radius:18px;background:var(--panel2);border:1px solid var(--line);word-wrap:break-word;white-space:pre-wrap;animation:in .25s var(--ease) both}
.m.mine{margin-right:auto;margin-left:0;background:var(--mine);border-color:rgba(214,180,122,.35);border-bottom-left-radius:6px}
.m:not(.mine){margin-left:auto;margin-right:0;border-bottom-right-radius:6px}
.m img{display:block;max-width:100%;max-height:300px;border-radius:12px;margin-bottom:2px}
.m audio{width:230px;max-width:100%;height:40px}
.m .f{display:flex;align-items:center}.m .f i{font-style:normal;font-size:26px;margin-left:10px}.m .f b{font-weight:600}.m .f small{display:block;color:var(--mute)}
.m .meta{font-size:11px;color:var(--mute);margin-top:3px;text-align:left;white-space:normal}
.m .meta .bad{color:var(--bad)}
.day{text-align:center;color:var(--mute);font-size:12px;margin:12px 0 4px}
.note{text-align:center;color:var(--mute);font-size:12px;padding:6px 20px 0}
.comp{display:flex;align-items:flex-end;padding:8px 10px calc(10px + env(safe-area-inset-bottom));background:var(--bg2);border-top:1px solid var(--line)}
.comp textarea{flex:1;max-height:120px;min-height:44px;resize:none;padding:11px 14px;border-radius:22px;background:var(--panel2);border:1px solid var(--line);outline:none;margin:0 8px}
.comp textarea:focus{border-color:var(--ac3)}
.cb{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:20px;background:var(--panel2);border:1px solid var(--line)}
.cb.go{background:var(--ac);color:var(--onac);border-color:var(--ac)}
.cb.rec{background:var(--bad);border-color:var(--bad);color:#fff;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 8px rgba(239,91,91,.2)}}
.recbar{flex:1;display:none;align-items:center;padding:0 12px;color:var(--bad);font-weight:600}
.comp.rec .recbar{display:flex}.comp.rec textarea,.comp.rec #bAtt{display:none}
#sheet,#viewer{position:fixed;inset:0;display:none;z-index:20}
#sheet{background:rgba(0,0,0,.6);align-items:flex-end}#sheet.on{display:flex}
#sheetIn{width:100%;max-height:80%;overflow-y:auto;background:var(--panel);border-radius:26px 26px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));animation:in .3s var(--ease) both}
#sheetIn h3{margin:0 4px 12px;font:700 18px var(--fd)}
#sheetIn input[type=text]{width:100%;padding:13px 16px;border-radius:14px;background:var(--panel2);border:1px solid var(--line);outline:none;margin-bottom:10px;direction:ltr;text-align:center;font:700 20px var(--fd);letter-spacing:2px}
#sheetIn input.rt{direction:rtl;font:500 16px var(--fb);letter-spacing:0}
#sheetIn .btn{width:100%;margin-top:8px;text-align:center}
.opt{display:flex;align-items:center;padding:14px 8px;border-bottom:1px solid var(--line)}.opt:last-child{border:0}.opt i{font-style:normal;font-size:22px;margin-left:12px}.opt span{flex:1}
.tg{width:46px;height:27px;border-radius:14px;background:var(--line2);position:relative;transition:background .2s}.tg::after{content:"";position:absolute;top:3px;right:3px;width:21px;height:21px;border-radius:50%;background:#fff;transition:transform .2s}.tg.on{background:var(--ac)}.tg.on::after{transform:translateX(-19px)}
#viewer{background:#000;align-items:center;justify-content:center}#viewer.on{display:flex}#viewer img{max-width:100%;max-height:100%}
#toast{position:fixed;bottom:90px;left:50%;transform:translate(-50%,20px);padding:10px 18px;border-radius:14px;background:var(--panel2);border:1px solid var(--line2);opacity:0;pointer-events:none;transition:all .3s var(--ease);z-index:30}#toast.on{opacity:1;transform:translate(-50%,0)}
.wel{margin:auto;padding:28px;text-align:center;max-width:420px}.wel .logo{width:84px;height:84px;margin:0 auto 18px;border-radius:26px;background:var(--panel2);border:1px solid var(--line2);display:grid;place-items:center;font-size:38px}
.wel h1{font:800 34px var(--fd);margin:0 0 6px}.wel p{color:var(--mute);margin:0 0 22px}
.wel input{width:100%;padding:14px 18px;border-radius:16px;background:var(--panel2);border:1px solid var(--line);outline:none;margin-bottom:12px;text-align:center;font-size:17px}
</style>
</head>
<body>
<section class="view" id="vWel"><div class="wel"><div class="logo">💬</div><h1>تواصل</h1><p>رسائل وصور وملفات ورسائل صوتية بينك وبين شاشتك وأهلك. كل شي يرجع ينحذف بعد ٢٤ ساعة.</p><input id="wName" maxlength="30" placeholder="اسمك (يشوفه اللي تراسله)"><button class="btn pri" id="wGo" style="width:100%">ابدأ</button></div></section>

<section class="view" id="vHome">
  <div class="top"><h1>تواصل<small id="hSub">المحادثات</small></h1><button class="ib" id="bSet" aria-label="الإعدادات">⚙</button></div>
  <div class="scroll"><div class="me"><small>رمزك (أعطيه لمن يريد يراسلك، أو اكتبه بالشاشة)</small><div class="code" id="myCode"></div><div class="row2"><button class="btn" id="bCopy">نسخ</button><button class="btn" id="bShare">مشاركة</button></div></div><div id="list"></div></div>
  <button class="fab" id="bAdd">＋ إضافة شخص أو شاشة</button>
</section>

<section class="view" id="vChat">
  <div class="top"><button class="ib" id="bBack" aria-label="رجوع" style="margin-left:10px">→</button><h1 id="cName">—<small id="cSub"></small></h1><button class="ib" id="bCm" aria-label="خيارات">⋮</button></div>
  <div id="msgs"></div>
  <div class="comp" id="comp"><button class="cb" id="bAtt" aria-label="إرفاق">＋</button><textarea id="tx" rows="1" placeholder="اكتب رسالة…"></textarea><div class="recbar"><span id="recT">٠:٠٠</span>&nbsp;· تسجيل…</div><button class="cb" id="bMic" aria-label="صوت">🎤</button><button class="cb go" id="bSend" aria-label="إرسال" style="display:none">➤</button></div>
</section>

<div id="sheet"><div id="sheetIn"></div></div>
<div id="viewer"><img id="vImg" alt=""></div>
<div id="toast"></div>
<input type="file" id="fImg" accept="image/*" style="display:none">
<input type="file" id="fAny" style="display:none">
<script src="brands.js"></script>
<script src="tw-core.js"></script>
<script src="app.js"></script>
</body>
</html>
