# نسخة تجريبية مجانية: بدون قرص دائم، فالبيانات تنمسح عند إعادة التشغيل (الحسابات التجريبية ترجع تلقائيًا)
services:
  - type: web
    name: doctorna
    runtime: node
    plan: free
    branch: ccr-4240d295-xmzhyg
    rootDir: Doctorna/server
    buildCommand: npm install
    startCommand: node src/server.js
    healthCheckPath: /api/meta
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: DOCTORNA_DEMO
        value: "1"
      - key: OWNER_PHONE
        value: "07700000001"
      - key: OWNER_PASSWORD
        sync: false
