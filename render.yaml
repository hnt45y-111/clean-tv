# استضافة لعبة المافيا على Render (Blueprint). يُقرأ تلقائياً عند ربط المستودع بـ Render.
services:
  - type: web
    name: mafia-game
    runtime: node
    plan: free
    buildCommand: cd Mafia/server && npm ci --omit=dev
    startCommand: cd Mafia/server && node src/server.js
    healthCheckPath: /api/health
    autoDeploy: true
    buildFilter:
      paths:
        - Mafia/server/**
        - Mafia/client/**
    envVars:
      - key: NODE_VERSION
        value: 22.14.0
      - key: TRUST_PROXY
        value: "1"
      - key: MAFIA_DB
        value: ./data/mafia.db
