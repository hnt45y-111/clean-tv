plugins { id 'com.android.application' }
android {
    namespace 'com.cleantv.mobile'
    compileSdk 34
    defaultConfig {
        applicationId 'com.cleantv.mobile'
        minSdk 24
        targetSdk 34
        versionCode(project.hasProperty('buildNum') ? project.property('buildNum').toString().toInteger() : 1)
        versionName '2.0'
    }
    signingConfigs {
        fixed {
            storeFile file('mobile.keystore')
            storePassword 'cleantv123'
            keyAlias 'cleantv'
            keyPassword 'cleantv123'
        }
    }
    buildTypes { debug { signingConfig signingConfigs.fixed } }
    sourceSets.main {
        java.srcDirs += '../../widgets/java'
        res.srcDirs += '../../widgets/res'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    // the channel list, the logos and the fonts are the TV launcher's own files: copied in at build time, never duplicated in the repository
    sourceSets.main.assets.srcDirs += layout.buildDirectory.dir('shared-assets').get().asFile
}
tasks.register('copyShared', Copy) {
    from('../../CleanTV/app/src/main/assets') { include 'channels.js', 'logos/**', 'fonts/**' }
    from('../../Studio/app/src/main/assets') { include 'smart.js' }
    into layout.buildDirectory.dir('shared-assets')
}
tasks.matching { it.name == 'preBuild' }.configureEach { dependsOn 'copyShared' }
dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.3.1'
    implementation 'androidx.media3:media3-exoplayer-hls:1.3.1'
    implementation 'androidx.media3:media3-ui:1.3.1'
}
