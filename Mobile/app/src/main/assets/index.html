<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>قنواتي</title>
<style>
  @font-face { font-family: 'Plex'; font-weight: 400; src: url('fonts/PlexArabic-Regular.ttf'); }
  @font-face { font-family: 'Plex'; font-weight: 500 800; src: url('fonts/PlexArabic-SemiBold.ttf'); }
  @font-face { font-family: 'Amiri'; font-weight: 700; src: url('fonts/Amiri-Bold.ttf'); }
  /* the same look as قنواتي on the TV: pure black, one red accent, soft pills, outline icons, a little spring */
  :root { --rz: #FA0023; --rzrgb: 250,0,35; --cw: 116px; --nb: 24,24,24; --s1: #121212; --s2: #1A1A1A; --s3: #262626; --s4: #2E2E2E; --t2: #A3A3A3; --spring: cubic-bezier(.34,1.35,.64,1); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: #000; color: #fff; font-family: 'Plex', 'Tajawal', sans-serif; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100%; position: relative; }
  #app::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 260px; background: radial-gradient(420px 220px at 50% -14%, rgba(var(--rzrgb),.20), transparent 70%); pointer-events: none; }
  header { padding: 16px 18px 8px; display: flex; align-items: center; gap: 12px; position: relative; }
  .mark { width: 46px; height: 46px; border-radius: 16px; background: var(--rz); display: grid; place-items: center; flex: none; }
  .mark svg { width: 28px; height: 28px; stroke: #fff; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  header h1 { margin: 0; font-weight: 800; font-size: 26px; flex: 1; line-height: 1.1; } header h1 small { display: block; font-size: 12px; font-weight: 500; color: var(--t2); margin-top: 3px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: #555; display: none; } .dot.show { display: block; } .dot.good { background: #3DBE6C; } .dot.ok { background: #E0B03D; } .dot.bad { background: var(--rz); }
  .sw { font-size: 12px; color: var(--t2); }
  .search { margin: 4px 16px 10px; display: block; width: calc(100% - 32px); padding: 13px 22px; border-radius: 999px; border: 2px solid transparent; background: var(--s2); color: #fff; font: 600 16px 'Plex', sans-serif; outline: none; transition: border-color .2s; }
  .search:focus { border-color: var(--rz); }
  .chips { display: flex; gap: 8px; padding: 0 16px 10px; overflow-x: auto; scrollbar-width: none; flex: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 9px 18px; border-radius: 999px; background: var(--s2); color: #fff; font-size: 14px; font-weight: 700; white-space: nowrap; transition: transform .22s var(--spring), background .18s; }
  .chip:active { transform: scale(.94); } .chip.on { background: #fff; color: #000; }
  main { flex: 1; overflow-y: auto; padding: 0 14px 112px; -webkit-overflow-scrolling: touch; position: relative; }
  .row { display: flex; align-items: center; gap: 14px; padding: 10px 12px; margin-bottom: 8px; border-radius: 24px; background: var(--s1); content-visibility: auto; contain-intrinsic-size: auto 76px; transition: transform .22s var(--spring), background .18s; animation: up .38s var(--spring) both; }
  .row:active { background: var(--s4); transform: scale(.985); }
  .art { width: 56px; height: 56px; border-radius: 18px; flex: none; background: var(--s3); display: grid; place-items: center; overflow: hidden; position: relative; font-weight: 800; font-size: 20px; color: #fff; }
  .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #F4F4F4; padding: 5px; }
  .art.poster { background: linear-gradient(160deg, #1F1F1F, #141414); color: #3A3A3A; } .art.poster img { object-fit: cover; padding: 0; background: none; }
  .tx { flex: 1; min-width: 0; } .tx b { display: block; font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .tx small { color: var(--t2); font-size: 12px; font-weight: 500; }
  .star { color: #5a5a5a; padding: 8px 10px; display: grid; place-items: center; } .star svg { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; } .star.on { color: var(--rz); } .star.on svg { fill: var(--rz); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .card { content-visibility: auto; contain-intrinsic-size: auto 230px; animation: up .38s var(--spring) both; transition: transform .22s var(--spring); } .card:active { transform: scale(.95); }
  .card .art { width: 100%; height: auto; aspect-ratio: 2/3; border-radius: 20px; font-size: 40px; } .card b { display: block; font-size: 13px; font-weight: 700; margin-top: 7px; line-height: 1.3; max-height: 34px; overflow: hidden; }
  .card .fv { position: absolute; top: 8px; left: 8px; color: var(--rz); } .card .fv svg { width: 22px; height: 22px; fill: var(--rz); stroke: none; }
  @keyframes up { from { opacity: 0; transform: translateY(22px) scale(.97); } to { opacity: 1; transform: none; } }
  .empty { text-align: center; color: var(--t2); padding: 64px 24px; line-height: 1.9; font-weight: 600; }
  .tools { display: flex; gap: 8px; padding: 0 16px 10px; flex: none; } .tools button { flex: 1; padding: 11px; border-radius: 999px; border: 0; background: var(--s2); color: #fff; font: 700 13px 'Plex', sans-serif; transition: transform .22s var(--spring); } .tools button:active { transform: scale(.95); }
  /* the floating bottom bar, like the app's pill bar on the TV */
  nav { position: absolute; left: 14px; right: 14px; bottom: max(14px, env(safe-area-inset-bottom)); display: flex; gap: 4px; padding: 6px; border-radius: 32px; background: rgba(24,24,24,.96); box-shadow: 0 10px 30px rgba(0,0,0,.65); z-index: 5; }
  nav button { flex: 1; background: none; border: 0; color: var(--t2); padding: 9px 0 7px; border-radius: 26px; font: 700 11px 'Plex', sans-serif; transition: background .2s, color .2s, transform .22s var(--spring); } nav button:active { transform: scale(.93); }
  nav button svg { display: block; margin: 0 auto 3px; width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  nav button.on { background: var(--s4); color: #fff; } nav button.on svg { stroke: var(--rz); }
  .panel { background: var(--s1); border-radius: 28px; padding: 16px; margin-bottom: 12px; animation: up .38s var(--spring) both; } .panel h2 { margin: 0 0 6px; font-weight: 800; font-size: 19px; } .panel p { margin: 0 0 10px; color: var(--t2); font-size: 13px; line-height: 1.7; font-weight: 500; }
  .panel input, .panel textarea, .panel select { width: 100%; padding: 13px 18px; margin-bottom: 8px; border-radius: 20px; border: 2px solid transparent; background: var(--s2); color: #fff; font: 600 15px 'Plex', sans-serif; direction: ltr; text-align: left; outline: none; } .panel input:focus, .panel textarea:focus { border-color: var(--rz); } .panel input.rtl { direction: rtl; text-align: right; }
  .btn { width: 100%; padding: 14px; border-radius: 999px; border: 0; background: var(--rz); color: #fff; font: 800 15px 'Plex', sans-serif; margin-top: 4px; transition: transform .22s var(--spring); } .btn:active { transform: scale(.96); } .btn.sec { background: var(--s3); }
  .tog { display: flex; justify-content: space-between; align-items: center; padding: 10px 2px; font-weight: 600; } .tog i { width: 48px; height: 28px; border-radius: 14px; background: var(--s3); position: relative; transition: .25s var(--spring); } .tog i::after { content: ""; position: absolute; top: 3px; right: 3px; width: 22px; height: 22px; border-radius: 50%; background: #888; transition: .25s var(--spring); } .tog.on i { background: var(--rz); } .tog.on i::after { right: 23px; background: #fff; }
  .res { margin: 8px 0; padding: 12px 14px; border-radius: 20px; background: var(--s2); font-size: 14px; line-height: 1.7; } .res small { display: block; color: var(--t2); }
  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.7); display: none; align-items: flex-end; z-index: 20; } .sheet.on { display: flex; }
  .sheet > div { background: var(--s1); width: 100%; max-height: 78%; overflow-y: auto; border-radius: 32px 32px 0 0; padding: 16px 12px 26px; animation: up .35s var(--spring) both; }
  .sheet h3 { margin: 0 8px 12px; font-weight: 800; }
  #greet, #lock { position: fixed; inset: 0; background: radial-gradient(520px 440px at 50% 42%, #240208, #000 70%); display: none; align-items: center; justify-content: center; text-align: center; padding: 24px; }
  #greet { z-index: 50; } #lock { z-index: 60; } #greet.on, #lock.on { display: flex; } #greet.out { opacity: 0; transition: opacity .5s; }
  #greet span { display: inline-block; font-family: 'Amiri', serif; font-weight: 700; font-size: 50px; color: #fff; text-shadow: 0 0 26px rgba(var(--rzrgb),.5); clip-path: inset(-60% -30% -60% 130%); animation: wipe 1.1s cubic-bezier(.65,0,.25,1) .2s forwards; padding: 0 12px; }
  #greet .nm { display: block; font-size: 46px; background: linear-gradient(100deg, #9b0017, #ffd9de 50%, #9b0017); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; animation: wipe 1s cubic-bezier(.65,0,.25,1) 1s forwards, shine 2.2s ease-in-out 1.8s infinite; }
  #greet .rule { width: 200px; height: 3px; margin: 20px auto 0; background: linear-gradient(90deg, transparent, var(--rz), transparent); transform: scaleX(0); animation: grow .9s ease 1.5s forwards; }
  @keyframes wipe { from { clip-path: inset(-60% -30% -60% 130%); } to { clip-path: inset(-60% -30% -60% -30%); } }
  @keyframes shine { to { background-position: -150% 0; } } @keyframes grow { to { transform: scaleX(1); } }
  .lk { width: 100%; max-width: 360px; } .lk .mark { width: 76px; height: 76px; border-radius: 26px; margin: 0 auto 18px; } .lk .mark svg { width: 46px; height: 46px; }
  .lk h2 { margin: 0 0 6px; font-weight: 800; font-size: 28px; } .lk p { margin: 0 0 18px; color: var(--t2); font-size: 14px; line-height: 1.7; font-weight: 500; }
  .lk .code { font-family: monospace; font-size: 30px; font-weight: 800; letter-spacing: 3px; padding: 14px; border-radius: 22px; background: var(--s2); direction: ltr; margin-bottom: 10px; }
  .lk input { width: 100%; padding: 15px 18px; border-radius: 999px; border: 2px solid transparent; background: var(--s2); color: #fff; font: 800 20px monospace; text-align: center; letter-spacing: 3px; outline: none; margin: 14px 0 10px; text-transform: uppercase; } .lk input:focus { border-color: var(--rz); }
  .lk .msg { min-height: 22px; color: var(--rz); font-weight: 700; font-size: 14px; margin-bottom: 6px; } .shake { animation: shake .4s; } @keyframes shake { 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }

  .ed { color: #7a7a7a; padding: 8px 8px; display: grid; place-items: center; } .ed svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linejoin: round; stroke-linecap: round; }
  .sheet label.f { display: block; margin: 10px 10px 4px; font-size: 13px; color: var(--t2); }
  .sheet input { display: block; width: calc(100% - 16px); margin: 0 8px 4px; padding: 13px 18px; border-radius: 999px; border: 2px solid transparent; background: var(--s2); color: #fff; font: inherit; outline: none; } .sheet input:focus { border-color: var(--rz); }
  .sheet .btn { display: block; width: calc(100% - 16px); margin: 10px 8px 0; }
  #clipBar { position: fixed; top: 10px; left: 12px; right: 12px; z-index: 40; display: none; align-items: center; gap: 8px; padding: 10px 14px; border-radius: 28px; background: #1a1a1a; border: 1px solid #333; box-shadow: 0 12px 36px rgba(0,0,0,.6); }
  #clipBar.on { display: flex; animation: up .35s var(--spring) both; } #clipBar > div { flex: 1; min-width: 0; } #clipBar b { display: block; font-size: 14px; } #clipBar small { display: block; color: var(--t2); font-size: 11px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #clipBar button { border: 0; border-radius: 999px; padding: 10px 18px; background: var(--rz); color: #fff; font: inherit; font-weight: 700; } #clipBar button.x { background: #2a2a2a; padding: 10px 14px; }
  .sv { border: 0; border-radius: 999px; padding: 10px 16px; background: var(--rz); color: #fff; font: inherit; font-weight: 700; flex: none; } .sv.on { background: #1f6f43; }
  .sh { margin: 16px 18px 8px; font-weight: 800; font-size: 17px; }
  .hs { display: flex; gap: 10px; overflow-x: auto; padding: 0 16px 8px; scrollbar-width: none; } .hs::-webkit-scrollbar { display: none; } .hs .card { flex: 0 0 112px; width: 112px; }

  /* ---- cinema look: hero, top 10, categories, rows ---- */
  @keyframes kb { from { transform: scale(1.1) translate3d(0,0,0); } to { transform: scale(1.2) translate3d(-2%,-1.5%,0); } }
  @keyframes hin { from { opacity: 0; transform: translateY(22px); } to { opacity: 1; transform: none; } }
  @keyframes hbg { from { opacity: 0; } to { opacity: 1; } }
  @keyframes sweep { from { transform: translateX(-140%) skewX(-18deg); } to { transform: translateX(360%) skewX(-18deg); } }
  @keyframes shim { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(var(--rzrgb),.7); } 50% { box-shadow: 0 0 0 7px rgba(var(--rzrgb),0); } }
  .rv { opacity: 0; transform: translateY(20px); transition: opacity .55s ease, transform .65s cubic-bezier(.2,.8,.2,1); } .rv.in { opacity: 1; transform: none; }
  .hero { position: relative; height: 430px; margin: 0 -14px 6px; overflow: hidden; border-radius: 0 0 36px 36px; background: #0b0b0b; }
  .hero.sk, .card.sk .art { background: linear-gradient(90deg,#121212 0,#222 50%,#121212 100%); background-size: 200% 100%; animation: shim 1.3s linear infinite; }
  .hero .hbg { position: absolute; inset: -6% -6% -6% -6%; background-size: cover; background-position: center top; filter: saturate(1.25) brightness(.85); animation: kb 16s ease-in-out infinite alternate, hbg .9s ease both; will-change: transform; }
  .hero .hsh { position: absolute; inset: 0; background: linear-gradient(0deg,#000 3%,rgba(0,0,0,.35) 48%,rgba(0,0,0,.6) 100%), radial-gradient(420px 260px at 85% 8%, rgba(var(--rzrgb),.28), transparent 70%); }
  .hero .hin { position: absolute; right: 18px; left: 18px; bottom: 44px; animation: hin .7s cubic-bezier(.2,.8,.2,1) both; }
  .hero h2 { margin: 8px 0 8px; font: 800 30px/1.15 'Plex', sans-serif; text-shadow: 0 4px 26px rgba(0,0,0,.8); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .hbd { display: inline-block; padding: 5px 12px; border-radius: 999px; background: rgba(var(--rzrgb),.92); font-size: 12px; font-weight: 800; letter-spacing: .3px; }
  .hmeta { display: flex; flex-wrap: wrap; gap: 8px; font-size: 13px; color: #d4d4d4; font-weight: 600; } .hmeta span { padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,.12); } .hmeta .rt { background: rgba(255,196,0,.18); color: #ffd25e; }
  .hbt { display: flex; gap: 8px; margin-top: 14px; } .hbt button { border: 0; border-radius: 999px; padding: 12px 18px; background: rgba(255,255,255,.16); color: #fff; font: 800 14px 'Plex', sans-serif; backdrop-filter: blur(6px); transition: transform .22s var(--spring); position: relative; overflow: hidden; } .hbt button:active { transform: scale(.93); }
  .hbt button.pri { background: var(--rz); box-shadow: 0 12px 34px rgba(var(--rzrgb),.55); flex: 1.3; } .hbt button.pri::after { content: ""; position: absolute; top: 0; bottom: 0; width: 38px; background: rgba(255,255,255,.35); animation: sweep 2.6s ease-in-out infinite; }
  .hdt { position: absolute; bottom: 16px; left: 0; right: 0; display: flex; justify-content: center; gap: 6px; } .hdt i { width: 6px; height: 6px; border-radius: 4px; background: rgba(255,255,255,.35); transition: all .4s; } .hdt i.on { width: 22px; background: var(--rz); }
  .sh { display: flex; align-items: center; justify-content: space-between; } .sh a { color: var(--t2); font-size: 13px; font-weight: 700; }
  .hs { display: flex; gap: 10px; overflow-x: auto; padding: 4px 2px 12px; margin: 0 -14px; padding-inline: 16px; scrollbar-width: none; scroll-snap-type: x proximity; } .hs::-webkit-scrollbar { display: none; }
  .hs .card { flex: 0 0 116px; width: 116px; scroll-snap-align: start; }
  .t10 { gap: 4px; } .tn { position: relative; flex: 0 0 auto; width: 176px; height: 190px; display: flex; align-items: flex-end; scroll-snap-align: start; transition: transform .25s var(--spring); } .tn:active { transform: scale(.95); }
  .tn .nm { position: absolute; right: 0; bottom: -10px; font: 900 150px/1 'Plex', sans-serif; color: #000; -webkit-text-stroke: 4px rgba(255,255,255,.34); letter-spacing: -8px; z-index: 0; }
  .tn .art { position: relative; z-index: 1; width: 112px; height: 168px; border-radius: 18px; margin-right: auto; box-shadow: 0 14px 34px rgba(0,0,0,.7); }
  .cats .ct { flex: 0 0 150px; height: 88px; border-radius: 22px; background-size: cover; background-position: center; padding: 12px 14px; display: flex; flex-direction: column; justify-content: flex-end; scroll-snap-align: start; transition: transform .25s var(--spring); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); } .cats .ct:active { transform: scale(.94); }
  .cats .ct b { font-size: 15px; font-weight: 800; line-height: 1.2; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; } .cats .ct small { color: rgba(255,255,255,.7); font-size: 11px; margin-top: 2px; }
  .chs .ch { flex: 0 0 92px; width: 92px; text-align: center; animation: up .38s var(--spring) both; transition: transform .22s var(--spring); } .chs .ch:active { transform: scale(.92); }
  .ch .art { position: relative; width: 92px; height: 92px; border-radius: 26px; background: var(--s2); } .ch b { display: block; margin-top: 7px; font-size: 12px; font-weight: 700; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .ch .lv { position: absolute; top: 8px; left: 8px; width: 9px; height: 9px; border-radius: 50%; background: var(--rz); animation: pulse 1.8s infinite; }
  .now { position: relative; display: flex; align-items: center; gap: 14px; margin: 4px 0 8px; padding: 14px; border-radius: 30px; overflow: hidden; background: #111; box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); transition: transform .22s var(--spring); } .now:active { transform: scale(.97); }
  .now .nb { position: absolute; inset: 0; background: radial-gradient(260px 160px at 12% 0, rgba(var(--rzrgb),.5), transparent 70%), linear-gradient(120deg,#1c0408,#0a0a0a); }
  .now .art { position: relative; width: 74px; height: 74px; border-radius: 22px; flex: none; } .now .nt { position: relative; flex: 1; min-width: 0; } .now h3 { margin: 4px 0 2px; font-size: 20px; font-weight: 800; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .now small { color: var(--t2); font-size: 12px; }
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 800; color: #fff; } .live i { width: 8px; height: 8px; border-radius: 50%; background: var(--rz); animation: pulse 1.6s infinite; }
  .now .np { position: relative; width: 52px; height: 52px; border-radius: 50%; background: var(--rz); display: grid; place-items: center; font-size: 20px; box-shadow: 0 10px 28px rgba(var(--rzrgb),.55); flex: none; }
  .dt { position: relative; margin: -16px -12px -26px; padding: 18px 16px 26px; overflow: hidden; } .dtb { position: absolute; inset: -20px; background-size: cover; background-position: center; filter: blur(30px) brightness(.45) saturate(1.4); }
  .dti { position: relative; display: flex; gap: 14px; align-items: flex-end; } .dtp { width: 104px; flex: none; border-radius: 18px; box-shadow: 0 16px 36px rgba(0,0,0,.7); } .dtx h3 { margin: 0 0 8px; font-size: 21px; line-height: 1.25; }
  .dpl { position: relative; color: #ddd; font-size: 14px; line-height: 1.75; margin: 14px 4px 4px; max-height: 120px; overflow: auto; } .dbtn { position: relative; display: flex; gap: 8px; margin-top: 12px; } .dbtn .btn { flex: 1; margin: 0; width: auto; }
  .card { animation: up .42s var(--spring) both; }

  /* ================= 2.0: pages, title page, profile, customisation, themes ================= */
  body { background: #000; }
  .hav { width: 42px; height: 42px; border-radius: 50%; border: 0; font-size: 22px; background: var(--rz); display: grid; place-items: center; flex: none; box-shadow: 0 6px 18px rgba(var(--rzrgb),.4); transition: transform .25s var(--spring); } .hav:active { transform: scale(.88) rotate(-8deg); }
  @keyframes pgin { from { opacity: 0; transform: translateY(18px) scale(.985); } to { opacity: 1; transform: none; } }
  main.pg { animation: pgin .38s cubic-bezier(.2,.8,.2,1) both; }
  nav { z-index: 10; } nav button { position: relative; } nav button.on svg { transform: translateY(-2px) scale(1.12); } nav button svg { transition: transform .3s var(--spring), stroke .2s; }
  nav button.on::after { content: ""; position: absolute; bottom: 3px; left: 50%; width: 5px; height: 5px; margin-left: -2.5px; border-radius: 50%; background: var(--rz); animation: pop .35s var(--spring) both; } @keyframes pop { from { transform: scale(0); } }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 2px; } .ct.big { height: 84px; border-radius: 22px; padding: 12px 14px; display: flex; flex-direction: column; justify-content: flex-end; animation: up .4s var(--spring) both; } .ct.big b { font-size: 15px; font-weight: 800; } .ct.big small { color: rgba(255,255,255,.7); font-size: 11px; font-weight: 600; }
  .sh span { flex: 1; }
  .row.off { opacity: .45; } .ni { width: 24px; height: 24px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; } .pi { font-size: 22px; background: var(--s3); } .chev { color: var(--t2); font-size: 20px; padding: 0 8px; }
