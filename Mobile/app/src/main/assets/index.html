<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>قنواتي</title>
<style>
  @font-face { font-family: 'Kufi'; font-weight: 400 700; src: url('fonts/ReemKufi.ttf'); }
  @font-face { font-family: 'Plex'; font-weight: 400; src: url('fonts/PlexArabic-Regular.ttf'); }
  @font-face { font-family: 'Plex'; font-weight: 600; src: url('fonts/PlexArabic-SemiBold.ttf'); }
  @font-face { font-family: 'Amiri'; font-weight: 700; src: url('fonts/Amiri-Bold.ttf'); }
  :root { --ink: #15181B; --surf: #1E2327; --surf2: #272D33; --ivory: #EFE7D4; --copper: #D9822B; --chrome: #B8BDC2; --dim: #8B939A; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--ink); color: var(--ivory); font-family: 'Plex', 'Tajawal', sans-serif; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100%; }
  header { padding: 14px 16px 6px; display: flex; align-items: center; gap: 10px; }
  header h1 { margin: 0; font-family: 'Kufi', sans-serif; font-size: 28px; color: var(--ivory); flex: 1; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: #6b7280; display: none; } .dot.show { display: block; } .dot.good { background: #3DBE6C; } .dot.ok { background: var(--copper); } .dot.bad { background: #D9463C; }
  .sw { font-size: 13px; color: var(--dim); }
  .search { margin: 4px 16px 8px; display: block; width: calc(100% - 32px); padding: 12px 16px; border-radius: 14px; border: 1px solid #ffffff14; background: var(--surf); color: var(--ivory); font: 16px 'Plex', sans-serif; outline: none; }
  .chips { display: flex; gap: 8px; padding: 0 16px 10px; overflow-x: auto; scrollbar-width: none; flex: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 8px 16px; border-radius: 999px; background: var(--surf); color: var(--chrome); font-size: 14px; border: 1px solid transparent; white-space: nowrap; }
  .chip.on { background: var(--ivory); color: var(--ink); font-weight: 600; }
  main { flex: 1; overflow-y: auto; padding: 0 12px 14px; -webkit-overflow-scrolling: touch; }
  .row { display: flex; align-items: center; gap: 12px; padding: 10px; margin-bottom: 8px; border-radius: 16px; background: var(--surf); content-visibility: auto; contain-intrinsic-size: auto 72px; }
  .row:active { background: var(--surf2); }
  .art { width: 56px; height: 56px; border-radius: 12px; flex: none; background: var(--surf2); display: grid; place-items: center; overflow: hidden; position: relative; font-family: 'Kufi', sans-serif; font-size: 22px; color: var(--chrome); }
  .art img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; background: var(--ivory); padding: 4px; }
  .art.poster img { object-fit: cover; padding: 0; background: none; }
  .tx { flex: 1; min-width: 0; } .tx b { display: block; font-size: 16px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; } .tx small { color: var(--dim); font-size: 12px; }
  .star { font-size: 22px; color: var(--dim); padding: 6px 10px; } .star.on { color: var(--copper); }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .card { content-visibility: auto; contain-intrinsic-size: auto 230px; } .card .art { width: 100%; height: auto; aspect-ratio: 2/3; border-radius: 12px; font-size: 40px; } .card b { display: block; font-size: 13px; margin-top: 6px; line-height: 1.3; max-height: 34px; overflow: hidden; }
  .empty { text-align: center; color: var(--dim); padding: 60px 24px; line-height: 1.8; }
  nav { display: flex; background: #101316; border-top: 1px solid #ffffff10; padding-bottom: env(safe-area-inset-bottom); flex: none; }
  nav button { flex: 1; background: none; border: 0; color: var(--dim); padding: 10px 0 8px; font: 12px 'Plex', sans-serif; } nav button i { display: block; font-style: normal; font-size: 22px; } nav button.on { color: var(--copper); }
  .tools { display: flex; gap: 8px; padding: 0 16px 8px; flex: none; } .tools button { flex: 1; padding: 10px; border-radius: 12px; border: 1px dashed #b8bdc255; background: none; color: var(--ivory); font: 13px 'Plex', sans-serif; } .tools button.on { background: var(--copper); border-style: solid; color: var(--ink); }
  .panel { background: var(--surf); border-radius: 18px; padding: 14px; margin-bottom: 12px; } .panel h2 { margin: 0 0 8px; font-family: 'Kufi', sans-serif; font-size: 20px; } .panel p { margin: 0 0 10px; color: var(--dim); font-size: 13px; line-height: 1.6; }
  .panel input, .panel textarea { width: 100%; padding: 12px; margin-bottom: 8px; border-radius: 12px; border: 1px solid #ffffff14; background: var(--ink); color: var(--ivory); font: 15px 'Plex', sans-serif; direction: ltr; text-align: left; } .panel input.rtl { direction: rtl; text-align: right; }
  .btn { width: 100%; padding: 13px; border-radius: 14px; border: 0; background: var(--copper); color: var(--ink); font: 600 15px 'Plex', sans-serif; margin-top: 4px; } .btn.sec { background: var(--surf2); color: var(--ivory); }
  .tog { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; } .tog i { width: 46px; height: 26px; border-radius: 13px; background: var(--surf2); position: relative; transition: .2s; } .tog i::after { content: ""; position: absolute; top: 3px; right: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--chrome); transition: .2s; } .tog.on i { background: var(--copper); } .tog.on i::after { right: 23px; background: var(--ivory); }
  .res { margin-top: 8px; padding: 10px; border-radius: 12px; background: var(--ink); font-size: 14px; line-height: 1.6; } .res small { display: block; color: var(--dim); }
  .sheet { position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none; align-items: flex-end; z-index: 20; } .sheet.on { display: flex; }
  .sheet > div { background: var(--surf); width: 100%; max-height: 75%; overflow-y: auto; border-radius: 22px 22px 0 0; padding: 14px 12px 24px; }
  .sheet h3 { margin: 0 6px 10px; font-family: 'Kufi', sans-serif; }
  #greet { position: fixed; inset: 0; z-index: 50; background: radial-gradient(500px 420px at 50% 45%, #262b22, #15181B 70%); display: none; align-items: center; justify-content: center; text-align: center; }
  #greet.on { display: flex; } #greet.out { opacity: 0; transition: opacity .5s; }
  #greet span { display: inline-block; font-family: 'Amiri', serif; font-weight: 700; font-size: 48px; color: var(--ivory); text-shadow: 0 0 24px #D9822B66; clip-path: inset(-60% -30% -60% 130%); animation: wipe 1.1s cubic-bezier(.65,0,.25,1) .2s forwards; padding: 0 12px; }
  #greet .nm { display: block; font-family: 'Kufi', sans-serif; font-size: 44px; background: linear-gradient(100deg, #B5681F, #FFF1D6 50%, #B5681F); background-size: 250% 100%; -webkit-background-clip: text; background-clip: text; color: transparent; text-shadow: none; animation: wipe 1s cubic-bezier(.65,0,.25,1) 1s forwards, shine 2.2s ease-in-out 1.8s infinite; }
  #greet .rule { width: 200px; height: 3px; margin: 20px auto 0; background: linear-gradient(90deg, transparent, var(--copper), transparent); transform: scaleX(0); animation: grow .9s ease 1.5s forwards; }
  @keyframes wipe { from { clip-path: inset(-60% -30% -60% 130%); } to { clip-path: inset(-60% -30% -60% -30%); } }
  @keyframes shine { to { background-position: -150% 0; } } @keyframes grow { to { transform: scaleX(1); } }
</style>
</head>
<body>
<div id="app">
  <header><h1 id="ttl">قنواتي</h1><span class="sw" id="netLbl"></span><i class="dot" id="netDot"></i></header>
  <div id="top"></div>
  <main id="main"></main>
  <nav id="nav">
    <button data-t="live" class="on"><i>📡</i>قنواتي</button>
    <button data-t="vod"><i>🎬</i><span id="vodTab">الأفلام</span></button>
    <button data-t="fav"><i>⭐</i>المفضلة</button>
    <button data-t="set"><i>⚙️</i>الإعدادات</button>
  </nav>
</div>
<div class="sheet" id="sheet"><div id="sheetIn"></div></div>
<div id="greet"></div>
<script src="channels.js"></script>
<script src="smart.js"></script>
<script src="mobile.js"></script>
</body>
</html>
