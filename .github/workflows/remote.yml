name: Build Remote App
on:
  push:
    paths:
      - 'Remote/**'
      - 'tools/brand/**'
      - '.github/workflows/remote.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Remote
    steps:
      - uses: actions/checkout@v4
      - name: Fonts
        run: bash tools/fonts.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        run: gradle assembleDebug --no-daemon -PbuildNum=${{ github.run_number }}
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk hawai-remote.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Hawai-apk
          path: Remote/hawai-remote.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "remote-${{ github.run_number }}" hawai-remote.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "هوائي ${{ github.run_number }}" --notes "هوائي ريموت مدير الشاشات" --latest=false
