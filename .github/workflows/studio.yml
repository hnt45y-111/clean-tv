name: Build Studio App
on:
  push:
    paths:
      - '.github/workflows/studio.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write project files
        run: echo "" | base64 -d | tar xz
      - name: Install ImageMagick
        run: command -v convert || (sudo apt-get update && sudo apt-get install -y imagemagick)
      - name: Launcher preview files
        run: python3 tools/launcher_assets.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        run: gradle assembleDebug --no-daemon -PbuildNum=${{ github.run_number }}
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk moamal-studio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MoamalStudio-apk
          path: moamal-studio.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "studio-${{ github.run_number }}" moamal-studio.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "مدير الشاشة ${{ github.run_number }}" --notes "تطبيق مدير الشاشة" --latest=false
