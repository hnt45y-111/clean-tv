name: Build Studio App
on:
  push:
    paths:
      - 'Studio/**'
      - 'CleanTV/app/src/main/assets/**'
      - 'CleanTV/tools/**'
      - '.github/workflows/studio.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Studio
    steps:
      - uses: actions/checkout@v4
      - name: Launcher copy for the live preview
        run: |
          rm -rf launcher_src launcher_src_tools
          cp -r ../CleanTV/app/src/main/assets launcher_src
          rm -rf launcher_src/bg launcher_src/fonts
          mkdir -p launcher_src_tools && cp ../CleanTV/tools/fetch_assets.py launcher_src_tools/
      - name: Install ImageMagick
        timeout-minutes: 6
        continue-on-error: true
        run: command -v convert || sudo timeout 150 apt-get install -y --no-install-recommends imagemagick || (sudo timeout 180 apt-get update && sudo timeout 150 apt-get install -y --no-install-recommends imagemagick)
      - name: Launcher preview files
        run: python3 tools/launcher_assets.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        run: gradle assembleDebug --no-daemon -PbuildNum=${{ github.run_number }}
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk moamal-studio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MoamalStudio-apk
          path: Studio/moamal-studio.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "studio-${{ github.run_number }}" moamal-studio.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "مدير الشاشة ${{ github.run_number }}" --notes "تطبيق مدير الشاشة" --latest=false
