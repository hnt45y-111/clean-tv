name: Build Tawasul App
on:
  push:
    paths:
      - 'Tawasul/**'
      - 'CleanTV/app/src/main/assets/tw-core.js'
      - '.github/workflows/tawasul.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ImageMagick
        run: command -v convert || (sudo apt-get update && sudo apt-get install -y imagemagick)
      - name: Fonts (the launcher's own tool)
        working-directory: CleanTV
        run: python3 tools/fetch_assets.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        working-directory: Tawasul
        run: gradle assembleDebug --no-daemon -PbuildNum=${{ github.run_number }}
      - name: Rename
        working-directory: Tawasul
        run: cp app/build/outputs/apk/debug/app-debug.apk tawasul.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Tawasul-apk
          path: Tawasul/tawasul.apk
      - name: Publish release
        working-directory: Tawasul
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "tawasul-${{ github.run_number }}" tawasul.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "تواصل ${{ github.run_number }}" --notes "رسائل وصور وملفات ورسائل صوتية بين الموبايل والشاشة" --latest=false
