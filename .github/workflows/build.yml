name: Build APK
on:
  push:
    paths:
      - 'CleanTV/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CleanTV
    steps:
      - uses: actions/checkout@v4
      - name: Stamp build number
        run: |
          echo "${{ github.run_number }}" > app/src/main/assets/build.txt
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" app/build.gradle
      - name: QR library
        run: curl -sfL https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js -o app/src/main/assets/qrcode.js || true
      - name: Install ImageMagick
        run: command -v convert || (sudo apt-get update && sudo apt-get install -y imagemagick)
      - name: Download fonts and shrine photos
        run: python3 tools/fetch_assets.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        run: gradle assembleDebug --no-daemon -PbuildNum=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: CleanTV-apk
          path: CleanTV/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "build-${{ github.run_number }}" app/build/outputs/apk/debug/app-debug.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "Clean TV build ${{ github.run_number }}" --notes "APK"
