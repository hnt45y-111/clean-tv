name: Build Calm Your Nerves 3D APK (native, libGDX)
on:
  push:
    paths:
      - 'CalmNerves3D/**'
      - '.github/workflows/calmnerves3d.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build
        working-directory: CalmNerves3D
        run: gradle :android:assembleDebug --no-daemon -PbuildNum=${{ github.run_number }}
      - name: Rename
        run: cp CalmNerves3D/android/build/outputs/apk/debug/android-debug.apk calm-your-nerves-3d.apk
      - uses: actions/upload-artifact@v4
        with: { name: CalmYourNerves3D-apk, path: calm-your-nerves-3d.apk }
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "calm3d-${{ github.run_number }}" calm-your-nerves-3d.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "هدّي أعصابك 3D ${{ github.run_number }}" --notes "APK (native Java / libGDX)" --latest=false
