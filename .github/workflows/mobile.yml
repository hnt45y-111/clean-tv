name: Build Mobile App
on:
  push:
    paths:
      - 'Mobile/**'
      - 'CleanTV/app/src/main/assets/channels.js'
      - 'CleanTV/app/src/main/assets/brands.js'
      - 'Studio/app/src/main/assets/smart.js'
      - 'tools/channel_logos.json'
      - '.github/workflows/mobile.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install ImageMagick
        run: command -v convert || (sudo apt-get update && sudo apt-get install -y imagemagick)
      - name: Fonts (the launcher's own tool)
        working-directory: CleanTV
        run: python3 tools/fetch_assets.py
      - name: Channel logos
        working-directory: CleanTV
        run: python3 ../tools/fetch_logos.py || true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        working-directory: Mobile
        run: gradle assembleDebug --no-daemon -PbuildNum=${{ github.run_number }}
      - name: Rename
        working-directory: Mobile
        run: cp app/build/outputs/apk/debug/app-debug.apk qanawati-mobile.apk
      - uses: actions/upload-artifact@v4
        with:
          name: QanawatiMobile-apk
          path: Mobile/qanawati-mobile.apk
      - name: Publish release
        working-directory: Mobile
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "mobile-${{ github.run_number }}" qanawati-mobile.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "قنواتي موبايل ${{ github.run_number }}" --notes "قنواتي والأفلام والمسلسلات للموبايل" --latest=false
