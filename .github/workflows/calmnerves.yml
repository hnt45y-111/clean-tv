name: Build Calm Your Nerves APK
on:
  push:
    paths:
      - 'CalmNerves/**'
      - '.github/workflows/calmnerves.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build
        working-directory: CalmNerves/android
        run: gradle assembleDebug --no-daemon -PbuildNum=${{ github.run_number }}
      - name: Rename
        run: cp CalmNerves/android/app/build/outputs/apk/debug/app-debug.apk calm-your-nerves.apk
      - uses: actions/upload-artifact@v4
        with: { name: CalmYourNerves-apk, path: calm-your-nerves.apk }
      - name: Publish release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: gh release create "calm-${{ github.run_number }}" calm-your-nerves.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "هدّي أعصابك ${{ github.run_number }}" --notes "APK" --latest=false
