name: Build Auto App
on:
  push:
    paths:
      - '.github/workflows/auto.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write project files
        run: echo "" | base64 -d | tar xz
      - name: Fonts
        run: bash tools/fonts.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Build
        run: gradle assembleDebug --no-daemon -PbuildNum=${{ github.run_number }}
      - name: Rename
        run: cp app/build/outputs/apk/debug/app-debug.apk msm-auto.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MsmAuto-apk
          path: msm-auto.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "auto-${{ github.run_number }}" msm-auto.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "مدير الشاشات أوتو ${{ github.run_number }}" --notes "تطبيق مدير الشاشات أوتو لشاشات أندرويد أوتو" --latest=false
