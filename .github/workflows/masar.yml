name: Build Masar App
on:
  push:
    paths:
      - '.github/workflows/masar.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Write project files
        run: echo "" | base64 -d | tar xz
      - name: Cairo font
        run: curl -fsSL -o app/src/main/assets/fonts/Cairo.ttf "https://github.com/google/fonts/raw/main/ofl/cairo/Cairo%5Bslnt%2Cwght%5D.ttf" || echo "no font"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - name: Build
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Rename
        run: cp app/build/outputs/apk/release/*.apk masar.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Masar-APK
          path: masar.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "masar-${{ github.run_number }}" masar.apk --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "مسار 1.0.${{ github.run_number }}" --notes "تطبيق مسار للإدارة المدرسية" --latest=false
