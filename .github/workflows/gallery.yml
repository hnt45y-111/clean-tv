name: Publish Design Gallery
on:
  push:
    paths:
      - 'gallery/**'
      - '.github/workflows/gallery.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gallery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la gallery
          gh release view gallery >/dev/null 2>&1 || gh release create gallery --target "${{ github.sha }}" --title "معرض الواجهات" --notes "واجهات جاهزة لتطبيق مدير الشاشة" --latest=false
          gh release upload gallery gallery/* --clobber
