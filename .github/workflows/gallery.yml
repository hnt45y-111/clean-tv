name: Publish Design Gallery
on:
  push:
    paths:
      - '.github/workflows/gallery.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gallery:
    runs-on: ubuntu-latest
    steps:
      - name: Write gallery files
        run: mkdir files && echo "" | base64 -d | tar xz -C files && ls -la files
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view gallery --repo "${{ github.repository }}" >/dev/null 2>&1 || gh release create gallery --repo "${{ github.repository }}" --target "${{ github.sha }}" --title "معرض الواجهات" --notes "واجهات جاهزة لتطبيق مدير الشاشة" --latest=false
          gh release upload gallery files/* --repo "${{ github.repository }}" --clobber
