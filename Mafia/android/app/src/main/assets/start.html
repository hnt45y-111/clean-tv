<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;gap:16px;padding:24px;box-sizing:border-box;background:radial-gradient(120% 60% at 50% -10%,rgba(217,35,60,.25),transparent 60%),#090D1B;color:#DCE5F5;font-family:system-ui,sans-serif}
h1{margin:0;text-align:center;font-size:44px;text-shadow:0 0 30px rgba(217,35,60,.7)} p{margin:0;color:rgba(220,229,245,.65);text-align:center;line-height:1.6}
input{direction:ltr;text-align:left;font-size:16px;padding:14px;border-radius:14px;border:1px solid rgba(220,229,245,.15);background:rgba(0,0,0,.3);color:#DCE5F5;outline:none}
button{font-size:18px;font-weight:700;padding:16px;border:0;border-radius:16px;color:#fff;background:linear-gradient(135deg,#e8334d,#D9233C)}
.err{color:#ff8a9a;text-align:center;min-height:22px}
</style></head><body>
<h1>مافيا</h1>
<p>أدخل عنوان خادم اللعبة<br>مثال: <span dir="ltr">mafia-game.onrender.com</span></p>
<input id="u" type="url" inputmode="url" autocomplete="off" placeholder="https://...">
<div class="err" id="e"></div>
<button id="b">اتصال</button>
<script>
var u=document.getElementById('u'),e=document.getElementById('e');
try{u.value=Android.getServer()||'';}catch(x){}
var m=location.hash.match(/err=([^&]*)/); if(m) e.textContent=decodeURIComponent(m[1]);
document.getElementById('b').onclick=function(){ if(!u.value.trim()){e.textContent='اكتب العنوان أولاً';return;} e.textContent=''; Android.connect(u.value); };
</script></body></html>
