plugins { id 'com.android.application' }
// عنوان الخادم الافتراضي يُمرَّر عند البناء: -PserverUrl=https://… (فارغ ⇒ يسأل التطبيق عنه أول مرة)
def serverUrl = project.hasProperty('serverUrl') ? project.property('serverUrl').toString().trim() : ''
android {
    namespace 'com.mafia.game'
    compileSdk 34
    defaultConfig {
        applicationId 'com.mafia.game'
        minSdk 24
        targetSdk 34
        versionCode(project.hasProperty('buildNum') ? project.property('buildNum').toString().toInteger() : 1)
        versionName '1.0'
        buildConfigField 'String', 'SERVER_URL', "\"${serverUrl}\""
    }
    buildFeatures { buildConfig true }
    signingConfigs {
        fixed { storeFile file('mafia.keystore'); storePassword 'mafiagame1'; keyAlias 'mafia'; keyPassword 'mafiagame1' }
    }
    buildTypes { debug { signingConfig signingConfigs.fixed } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
